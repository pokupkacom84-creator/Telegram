name: Одноразовое создание keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Создать keystore и резервную копию
        env:
          KS_STORE_PASS: ${{ secrets.KS_STORE_PASS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -e
          if [ -z "$KS_STORE_PASS" ] || [ -z "$KS_KEY_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Сначала создайте секреты KS_STORE_PASS, KS_KEY_PASS, KS_ALIAS"
            exit 1
          fi
          keytool -genkeypair -keystore release.keystore -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_STORE_PASS" -keypass "$KS_KEY_PASS" \
            -dname "CN=FluxGram, O=FluxGram, C=RU"
          # Резервная копия: зашифрована паролем хранилища
          gpg --batch --yes --pinentry-mode loopback --passphrase "$KS_STORE_PASS" \
            --symmetric --cipher-algo AES256 -o keystore-backup.gpg release.keystore
          base64 -w0 release.keystore > ks.b64

      - name: Записать KEYSTORE_BASE64 в секреты
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          set -e
          if gh secret list -R "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_BASE64'; then
            echo "::error::KEYSTORE_BASE64 уже есть. Не перезаписываю, чтобы не сломать подпись"
            exit 1
          fi
          gh secret set KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY" < ks.b64

      - name: Загрузить резервную копию
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore-backup.gpg
          retention-days: 1

      - name: Удалить открытый ключ с раннера
        if: always()
        run: rm -f release.keystore ks.b64
