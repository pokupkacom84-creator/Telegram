name: Одноразовое создание keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Создать keystore
        env:
          P1: ${{ secrets.KEYSTORE_PASSWORD }}
          P2: ${{ secrets.KEY_PASSWORD }}
          AL: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$P1" ] || [ -z "$P2" ] || [ -z "$AL" ]; then
            echo "::error::Сначала создайте секреты KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS"
            exit 1
          fi
          keytool -genkeypair -keystore release.keystore -alias "$AL" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$P1" -keypass "$P2" \
            -dname "CN=FluxGram, O=FluxGram, C=RU"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$P1" \
            --symmetric --cipher-algo AES256 -o keystore-backup.gpg release.keystore
          base64 -w0 release.keystore > ks.b64

      - name: Записать KEYSTORE_BASE64
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Нет секрета SECRETS_PAT"
            exit 1
          fi
          if gh secret list -R "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_BASE64'; then
            echo "::error::KEYSTORE_BASE64 уже есть, не перезаписываю"
            exit 1
          fi
          gh secret set KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY" < ks.b64
          echo "KEYSTORE_BASE64 записан"

      - name: Резервная копия
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore-backup.gpg
          retention-days: 1

      - name: Удалить открытый ключ
        if: always()
        run: rm -f release.keystore ks.b64
