                     }
                 }
                 if (bool(K_SHL, true)) {
                     boolean mark = false;
                     try {
                         mark = SpyMode.isDeleted(mo) || edited(mo);
                     } catch (Throwable ignore) {
                     }
                     Drawable bg = v.getBackground();
                     if (mark) {
