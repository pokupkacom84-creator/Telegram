             addHeader(list, context, "Форма аватарок");
             preview = new Preview(context);
             preview.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             list.addView(preview, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, AndroidUtilities.dp(150)));
             shapeCell = new TextSettingsCell(context);
             shapeCell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             shapeCell.setOnClickListener(v -> {
                 AlertDialog.Builder b = new AlertDialog.Builder(context);
                 b.setTitle("Форма");
                 b.setItems(FluxStyle.SHAPES, (dialog, which) -> {
                     FluxStyle.setNum(FluxStyle.K_SHAPE, which);
                     updateCells();
                     preview.invalidate();
                     FluxStyle.refreshUi();
                 });
                 showDialog(b.create());
             });
             list.addView(shapeCell, matchWrap());
             Runnable shapeChanged = () -> preview.invalidate();
             addSlider(list, context, "Количество лепестков / сторон", FluxStyle.K_LOBES, 3, 14, 8, false, "", shapeChanged);
             addSlider(list, context, "Выраженность формы", FluxStyle.K_DEPTH, 0, 100, 50, false, " %", shapeChanged);
             addSlider(list, context, "Поворот", FluxStyle.K_ROT, 0, 359, 0, false, "°", shapeChanged);
             addNote(list, context, "Форма применяется ко всем круглым аватаркам: список чатов, шапка чата, профиль. «Круг» возвращает обычный вид.");

             updateCells();
             FluxStyle.springIn(root);
             return fragmentView;
         }

         private void updateCells() {
             int shape = FluxStyle.num(FluxStyle.K_SHAPE, 0);
             shapeCell.setTextAndValue("Форма", FluxStyle.SHAPES[Math.max(0, Math.min(shape, FluxStyle.SHAPES.length - 1))], false);
             int col = FluxStyle.num(FluxStyle.K_SCOLOR, FluxStyle.SPY_COLORS[0]);
             String name = FluxStyle.SPY_COLOR_NAMES[0];
             for (int i = 0; i < FluxStyle.SPY_COLORS.length; i++) {
                 if (FluxStyle.SPY_COLORS[i] == col) {
                     name = FluxStyle.SPY_COLOR_NAMES[i];
                 }
             }
             spyColorCell.setTextAndValue("Цвет подсветки", name, false);
         }

         private LinearLayout.LayoutParams matchWrap() {
             return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
         }

         private void addHeader(LinearLayout list, Context context, String title) {
             HeaderCell header = new HeaderCell(context);
             header.setText(title);
             header.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             list.addView(header, matchWrap());
         }

         private void addSwitch(LinearLayout list, Context context, String title, final String key, final boolean def, boolean divider) {
             final TextCheckCell cell = new TextCheckCell(context);
             cell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             cell.setTextAndCheck(title, FluxStyle.bool(key, def), divider);
             cell.setOnClickListener(v -> {
                 boolean value = !FluxStyle.bool(key, def);
                 FluxStyle.setBool(key, value);
                 cell.setChecked(value);
                 FluxStyle.pop(cell);
             });
             list.addView(cell, matchWrap());
         }

         private void addNote(LinearLayout list, Context context, String text) {
             TextView note = new TextView(context);
             note.setText(text);
             note.setTextSize(14);
             note.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
             note.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(10), AndroidUtilities.dp(21), AndroidUtilities.dp(16));
             list.addView(note, matchWrap());
         }

         private void addSlider(LinearLayout list, Context context, final String title, final String key, final int min, final int max,
                                int def, final boolean zeroDefault, final String unit, final Runnable after) {
             LinearLayout box = new LinearLayout(context);
             box.setOrientation(LinearLayout.VERTICAL);
             box.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             final TextView label = new TextView(context);
             label.setTextSize(16);
             label.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
             label.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(12), AndroidUtilities.dp(21), 0);
             box.addView(label, matchWrap());
             final SeekBar bar = new SeekBar(context);
             bar.setMax(max - min);
             int cur = FluxStyle.num(key, def);
             bar.setProgress(Math.max(0, Math.min(max - min, cur - min)));
             bar.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(6), AndroidUtilities.dp(21), AndroidUtilities.dp(12));
             box.addView(bar, matchWrap());
             label.setText(sliderText(title, cur, zeroDefault, unit));
             bar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                 @Override
                 public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                     int v = progress + min;
                     FluxStyle.setNum(key, v);
                     label.setText(sliderText(title, v, zeroDefault, unit));
                     if (FluxStyle.K_RADIUS.equals(key)) {
                         FluxStyle.applyRadius();
                     }
                     if (after != null) {
                         after.run();
                     }
                 }

                 @Override
                 public void onStartTrackingTouch(SeekBar sb) { }

                 @Override
                 public void onStopTrackingTouch(SeekBar sb) {
                     FluxStyle.refreshUi();
                 }
             });
             list.addView(box, matchWrap());
         }

         private String sliderText(String title, int v, boolean zeroDefault, String unit) {
             return title + ": " + (zeroDefault && v == 0 ? "по умолчанию" : v + unit);
         }
     }'''
