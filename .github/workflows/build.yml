             UserConfig uc = UserConfig.getInstance(account);
             if (!uc.isClientActivated()) {
                 return;
             }
             TLRPC.User me = uc.getCurrentUser();
             long uid = uc.getClientUserId();
             long t = now();
             String first = null;
             String key = "flux_name_try_" + uid;
             if (me != null && me.first_name != null && !isMarked(me)
                     && me.first_name.length() + MARK.length() <= 64
                     && t - prefs().getLong(key, 0L) >= MARK_RETRY_MS) {
                 first = me.first_name + MARK;
                 prefs().edit().putLong(key, t).apply();
             }
             String cleanAbout = null;
             String key2 = "flux_clean_try_" + uid;
             if (about != null && isFluxUser(about) && t - prefs().getLong(key2, 0L) >= MARK_RETRY_MS) {
                 cleanAbout = about.replace(MARK, "");
