         "- [ ] Обычные самоуничтожающиеся сообщения в секретных чатах исчезают как раньше",
     ]
     with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
         f.write("## FluxGram: view-once и папка FluxGram/\n```\n" + "\n".join(report) + "\n```\n" + "\n".join(checklist) + "\n")
     print("\n".join(report))
     if failed:
         print("::error::Часть патчей не применилась: " + "; ".join(failed))
         sys.exit(1)
