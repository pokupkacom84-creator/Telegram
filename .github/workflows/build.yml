                         }
                         u.premium = true;
                     } else if (p != null && p.contains(rk)) {
                         u.premium = p.getBoolean(rk, false);
                         p.edit().remove(rk).apply();
                     }
                 }
             } catch (Throwable t) {
                 FileLog.e(t);
             }
         }

         public static void startup() {
             new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
