     import re, sys
     try:
         import urllib.request
         RAW = "https://raw.githubusercontent.com/pokupkacom84-creator/Prem-VpnKey/main/Vpn"
         FALLBACK = "https://cdn.jsdelivr.net/gh/pokupkacom84-creator/Prem-VpnKey@main/Vpn"
         body = None
         for url in (RAW, FALLBACK):
             try:
                 req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                 with urllib.request.urlopen(req, timeout=20) as r:
                     if r.status == 200:
                         body = r.read().decode("utf-8", errors="replace")
                         print("FluxProxy: загружен список с", url)
                         break
             except Exception as e:
                 print("FluxProxy: не удалось загрузить", url, ":", e)
         entries = []
         if body:
             for line in body.splitlines():
                 line = line.strip()
                 if not line or line.startswith('#'):
                     continue
                 # webproxy format: https://t.me/webproxy?server=HOST&secret=SECRET  (port 443)
                 m = re.search(r'[?&]server=([^&\s]+).*[?&]secret=([^&\s]+)', line)
                 if m:
                     host, secret = m.group(1), m.group(2)
                     entries.append("%s|443|%s" % (host, secret))
                     continue
                 # full proxy format: https://t.me/proxy?server=HOST&port=PORT&secret=SECRET
                 ms = re.search(r'[?&]server=([^&\s]+)', line)
                 mp = re.search(r'[?&]port=([^&\s]+)', line)
                 msc = re.search(r'[?&]secret=([^&\s]+)', line)
                 if ms and mp and msc:
                     entries.append("%s|%s|%s" % (ms.group(1), mp.group(1), msc.group(1)))
                     continue
         # deduplicate
         seen = set()
         unique = []
         for e in entries:
             k = e.split('|')[0].lower() + ':' + e.split('|')[1]
             if k not in seen:
                 seen.add(k)
                 unique.append(e)
         baked = "\n".join(unique)
         print("FluxProxy: встроено прокси: %d" % len(unique))
         with open("/tmp/flux_baked.txt", "w") as f:
             f.write(baked)
         import os
         with open(os.environ.get("GITHUB_ENV", "/dev/null"), "a") as f:
             f.write("FLUX_BAKED=%s\n" % baked.replace("\n", "\\n"))
     except Exception as e:
         print("::warning::FluxProxy: ошибка загрузки встроенного списка:", e)
         with open("/tmp/flux_baked.txt", "w") as f:
             f.write("")
