             try {
                 return prefs().getBoolean(KEY_KEEP, true);
             } catch (Throwable e) {
                 return false;
             }
         }

         public static void setKeepEnabled(boolean value) {
             prefs().edit().putBoolean(KEY_KEEP, value).apply();
         }

         public static boolean isViewOnce(MessageObject m) {
             if (m == null || m.messageOwner == null || m.messageOwner instanceof TLRPC.TL_message_secret) {
                 return false;
             }
             TLRPC.MessageMedia media = MessageObject.getMedia(m.messageOwner);
             return media != null && media.ttl_seconds != 0;
         }

         public static boolean shouldKeep(MessageObject m) {
             return keepEnabled() && isViewOnce(m);
         }

         private static synchronized Set<String> names() {
             if (protectedNames == null) {
                 protectedNames = new HashSet<>(prefs().getStringSet(KEY_FILES, new HashSet<String>()));
             }
             return protectedNames;
         }

         public static synchronized void protect(File f) {
             if (f == null) return;
             if (names().add(f.getName())) {
                 prefs().edit().putStringSet(KEY_FILES, new HashSet<>(names())).apply();
             }
         }

         public static synchronized boolean isProtected(File f) {
             return f != null && keepEnabled() && names().contains(f.getName());
         }
     }
