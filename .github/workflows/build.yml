                         boolean first;
                         synchronized (ANIMATED) {
                             first = ANIMATED.add(key);
                             if (ANIMATED.size() > 64) {
                                 ANIMATED.remove(ANIMATED.iterator().next());
                             }
                         }
                         if (first) {
                             final boolean out = mo.isOutOwner();
                             v.post(new Runnable() {
                                 @Override
                                 public void run() {
                                     float px = out ? v.getWidth() - AndroidUtilities.dp(10) : AndroidUtilities.dp(10);
