      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          EXTRA=""
          if [ "$REBRAND" != "false" ] && [ -f rebrand.init.gradle ]; then
            EXTRA="-I rebrand.init.gradle"
          fi
          if [ -n "$ABI" ] && [ "$ABI" != "all" ]; then
            EXTRA="$EXTRA -Pandroid.injected.build.abi=$ABI"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --console=plain --max-workers=4 $EXTRA \
            -PRELEASE_STORE_PASSWORD="$KS_STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
