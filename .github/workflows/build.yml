     package org.telegram.messenger;
     import android.content.ClipData;
     import android.content.ClipboardManager;
     import android.content.Context;
     import android.content.SharedPreferences;
     import android.graphics.Paint;
     import android.os.SystemClock;
     import android.text.Editable;
     import android.text.Spannable;
     import android.text.SpannableStringBuilder;
     import android.util.Base64;
     import android.widget.EditText;
     import org.telegram.tgnet.SerializedData;
     import org.telegram.tgnet.TLRPC;
     import java.lang.reflect.Field;
     import java.lang.reflect.Method;
     import java.lang.reflect.Modifier;
     import java.util.ArrayList;
     import java.util.Collections;
     import java.util.Comparator;
     import java.util.List;
     public class FluxClip {
         private static final String PREFS = "flux_clip";
         private static final String KEY_ENABLED = "enabled";
         private static volatile MessageObject source;
         private static volatile long sourceTime;
         private static String lastPlain;
         private static String lastEntities;
         private static SharedPreferences prefs() {
             Context c = ApplicationLoader.applicationContext;
             return c == null ? null : c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
         }
         public static boolean enabled() {
             SharedPreferences p = prefs();
             return p == null || p.getBoolean(KEY_ENABLED, true);
         }
         public static void setEnabled(boolean v) {
             SharedPreferences p = prefs();
             if (p != null) {
                 p.edit().putBoolean(KEY_ENABLED, v).apply();
             }
         }
         public static void setSource(MessageObject m) {
             source = m;
             sourceTime = SystemClock.elapsedRealtime();
         }
         public static CharSequence hint(Object helper, CharSequence text) {
             try {
                 Object view = fieldValue(helper, "selectedView");
                 if (view instanceof org.telegram.ui.Cells.ChatMessageCell) {
                     MessageObject m = ((org.telegram.ui.Cells.ChatMessageCell) view).getMessageObject();
                     if (m != null) {
                         setSource(m);
                     }
                 }
             } catch (Throwable ignore) { }
             return text;
         }
         private static Object fieldValue(Object o, String name) {
             try {
                 for (Class<?> c = o.getClass(); c != null; c = c.getSuperclass()) {
                     try {
                         Field f = c.getDeclaredField(name);
                         f.setAccessible(true);
                         return f.get(o);
                     } catch (NoSuchFieldException ignore) { }
                 }
                 Field outer = null;
                 try {
                     outer = o.getClass().getDeclaredField("this$0");
                 } catch (NoSuchFieldException ignore) { }
                 if (outer != null) {
                     outer.setAccessible(true);
                     Object parent = outer.get(o);
                     if (parent != null && parent != o) {
                         return fieldValue(parent, name);
                     }
                 }
             } catch (Throwable ignore) { }
             return null;
         }
         public static boolean put(CharSequence str) {
             try {
                 if (str == null || !enabled()) return false;
                 MessageObject m = source;
                 if (m == null || SystemClock.elapsedRealtime() - sourceTime > 1500 || m.messageOwner == null) return false;
                 String full = m.messageOwner.message;
                 ArrayList<TLRPC.MessageEntity> all = m.messageOwner.entities;
                 if (full == null || all == null || all.isEmpty()) return false;
                 String plain = str.toString();
                 if (plain.isEmpty() || plain.length() > 20000) return false;
                 int idx = full.indexOf(plain);
                 if (idx < 0) return false;
                 ArrayList<TLRPC.MessageEntity> cut = clip(all, idx, plain.length());
                 if (cut.isEmpty()) return false;
                 String data = encode(cut);
                 if (data == null) return false;
                 Context ctx = ApplicationLoader.applicationContext;
                 ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                 if (cm == null) return false;
                 cm.setPrimaryClip(ClipData.newHtmlText("label", plain, toHtml(plain, cut)));
                 lastPlain = plain;
                 lastEntities = data;
                 SharedPreferences p = prefs();
                 if (p != null) {
                     p.edit().putString("plain", plain).putString("ents", data).apply();
                 }
                 return true;
             } catch (Throwable t) {
                 return false;
             }
         }
         private static ArrayList<TLRPC.MessageEntity> clip(List<TLRPC.MessageEntity> all, int from, int len) {
             ArrayList<TLRPC.MessageEntity> out = new ArrayList<>();
             for (TLRPC.MessageEntity e : all) {
                 int s = Math.max(e.offset, from);
                 int t = Math.min(e.offset + e.length, from + len);
                 if (t <= s) continue;
                 TLRPC.MessageEntity c = copy(e);
                 if (c == null) continue;
                 c.offset = s - from;
                 c.length = t - s;
                 out.add(c);
             }
             return out;
         }
         private static TLRPC.MessageEntity copy(TLRPC.MessageEntity e) {
             try {
                 SerializedData d = new SerializedData();
                 e.serializeToStream(d);
                 SerializedData r = new SerializedData(d.toByteArray());
                 int c = r.readInt32(false);
                 return TLRPC.MessageEntity.TLdeserialize(r, c, false);
             } catch (Throwable t) {
                 return null;
             }
         }
         private static String encode(List<TLRPC.MessageEntity> list) {
             try {
                 SerializedData d = new SerializedData();
                 d.writeInt32(list.size());
                 for (TLRPC.MessageEntity e : list) {
                     e.serializeToStream(d);
                 }
                 return Base64.encodeToString(d.toByteArray(), Base64.NO_WRAP);
             } catch (Throwable t) {
                 return null;
             }
         }
         private static ArrayList<TLRPC.MessageEntity> decode(String data) {
             try {
                 SerializedData r = new SerializedData(Base64.decode(data, Base64.NO_WRAP));
                 int n = r.readInt32(false);
                 ArrayList<TLRPC.MessageEntity> out = new ArrayList<>();
                 for (int i = 0; i < n; i++) {
                     int c = r.readInt32(false);
                     TLRPC.MessageEntity e = TLRPC.MessageEntity.TLdeserialize(r, c, false);
                     if (e != null) {
                         out.add(e);
                     }
                 }
                 return out;
             } catch (Throwable t) {
                 return null;
             }
         }
         private static String tag(TLRPC.MessageEntity e, boolean open) {
             String n = e.getClass().getSimpleName();
             String t = null;
             if (n.contains("Bold")) t = "b";
             else if (n.contains("Italic")) t = "i";
             else if (n.contains("Underline")) t = "u";
             else if (n.contains("Strike")) t = "s";
             else if (n.contains("Blockquote")) t = "blockquote";
             else if (n.contains("Pre")) t = "pre";
             else if (n.contains("Code") && !n.contains("Custom")) t = "code";
             if (t != null) return open ? "<" + t + ">" : "</" + t + ">";
             if (n.contains("TextUrl")) {
                 if (!open) return "</a>";
                 try {
                     Object url = e.getClass().getField("url").get(e);
                     return "<a href=\"" + String.valueOf(url).replace("\"", "&quot;") + "\">";
                 } catch (Throwable ignore) {
                     return null;
                 }
             }
             return null;
         }
         private static String toHtml(String text, List<TLRPC.MessageEntity> ents) {
             ArrayList<TLRPC.MessageEntity> order = new ArrayList<>(ents);
             Collections.sort(order, new Comparator<TLRPC.MessageEntity>() {
                 @Override
                 public int compare(TLRPC.MessageEntity a, TLRPC.MessageEntity b) {
                     if (a.offset != b.offset) return a.offset < b.offset ? -1 : 1;
                     return b.length - a.length;
                 }
             });
             StringBuilder sb = new StringBuilder();
             int n = text.length();
             for (int i = 0; i <= n; i++) {
                 for (int k = order.size() - 1; k >= 0; k--) {
                     TLRPC.MessageEntity e = order.get(k);
                     if (e.offset + e.length == i) {
                         String t = tag(e, false);
                         if (t != null) sb.append(t);
                     }
                 }
                 if (i == n) break;
                 for (int k = 0; k < order.size(); k++) {
                     TLRPC.MessageEntity e = order.get(k);
                     if (e.offset == i) {
                         String t = tag(e, true);
                         if (t != null) sb.append(t);
                     }
                 }
                 char ch = text.charAt(i);
                 if (ch == '&') sb.append("&amp;");
                 else if (ch == '<') sb.append("&lt;");
                 else if (ch == '>') sb.append("&gt;");
                 else if (ch == '\n') sb.append("<br>");
                 else sb.append(ch);
             }
             return sb.toString();
         }
         public static boolean pasteInto(EditText et) {
             try {
                 if (et == null || !enabled()) return false;
                 Context ctx = ApplicationLoader.applicationContext;
                 ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                 if (cm == null || !cm.hasPrimaryClip()) return false;
                 ClipData d = cm.getPrimaryClip();
                 if (d == null || d.getItemCount() == 0) return false;
                 CharSequence t = d.getItemAt(0).coerceToText(ctx);
                 if (t == null) return false;
                 String plain = t.toString();
                 String lp = lastPlain;
                 String le = lastEntities;
                 if (lp == null) {
                     SharedPreferences p = prefs();
                     if (p != null) {
                         lp = p.getString("plain", null);
                         le = p.getString("ents", null);
                     }
                 }
                 if (lp == null || le == null || !plain.equals(lp)) return false;
                 ArrayList<TLRPC.MessageEntity> ents = decode(le);
                 if (ents == null || ents.isEmpty()) return false;
                 CharSequence styled = style(plain, ents, et);
                 if (styled == null) return false;
                 Editable ed = et.getText();
                 int ss = Math.max(0, et.getSelectionStart());
                 int se = Math.max(0, et.getSelectionEnd());
                 int a = Math.min(ss, se);
                 int b = Math.max(ss, se);
                 ed.replace(a, b, styled);
                 et.setSelection(Math.min(ed.length(), a + styled.length()));
                 return true;
             } catch (Throwable t) {
                 return false;
             }
         }
         private static CharSequence style(String plain, List<TLRPC.MessageEntity> ents, EditText et) {
             ArrayList<TLRPC.MessageEntity> list = new ArrayList<>(ents);
             SpannableStringBuilder sb = new SpannableStringBuilder(plain);
             boolean done = false;
             try {
                 for (Method m : MediaDataController.class.getDeclaredMethods()) {
                     if (!m.getName().equals("addTextStyleRuns") || !Modifier.isStatic(m.getModifiers())) continue;
                     Class<?>[] pt = m.getParameterTypes();
                     if (pt.length < 3 || pt.length > 4) continue;
                     if (!pt[0].isAssignableFrom(ArrayList.class) || pt[1] != CharSequence.class || pt[2] != Spannable.class) continue;
                     if (pt.length == 4 && pt[3] != int.class) continue;
                     m.setAccessible(true);
                     if (pt.length == 4) {
                         m.invoke(null, list, plain, sb, -1);
                     } else {
                         m.invoke(null, list, plain, sb);
                     }
                     done = true;
                     break;
                 }
             } catch (Throwable ignore) { }
             try {
                 for (TLRPC.MessageEntity e : list) {
                     if (!e.getClass().getSimpleName().contains("Blockquote")) continue;
                     int s = e.offset;
                     int t = Math.min(sb.length(), e.offset + e.length);
                     if (t <= s) continue;
                     boolean has = false;
                     for (Object span : sb.getSpans(s, t, Object.class)) {
                         if (span.getClass().getName().contains("Quote")) {
                             has = true;
                             break;
                         }
                     }
                     if (has) continue;
                     boolean collapsed = false;
                     try {
                         collapsed = e.getClass().getField("collapsed").getBoolean(e);
                     } catch (Throwable ignore) { }
                     Class<?> q = Class.forName("org.telegram.ui.Components.QuoteSpan");
                     for (Method m : q.getDeclaredMethods()) {
                         Class<?>[] pt = m.getParameterTypes();
                         if (m.getName().equals("putQuote") && Modifier.isStatic(m.getModifiers())
                                 && pt.length == 4 && pt[0] == Spannable.class && pt[1] == int.class && pt[2] == int.class && pt[3] == boolean.class) {
                             m.setAccessible(true);
                             m.invoke(null, sb, s, t, collapsed);
                             done = true;
                             break;
                         }
                     }
                 }
             } catch (Throwable ignore) { }
             CharSequence out = sb;
             try {
                 for (Method m : MediaDataController.class.getDeclaredMethods()) {
                     if (!m.getName().equals("addAnimatedEmojiSpans") || !Modifier.isStatic(m.getModifiers())) continue;
                     Class<?>[] pt = m.getParameterTypes();
                     if (pt.length != 3 || !pt[0].isAssignableFrom(ArrayList.class) || pt[1] != CharSequence.class) continue;
                     m.setAccessible(true);
                     Paint.FontMetricsInt fm = et.getPaint().getFontMetricsInt();
                     Object r = m.invoke(null, list, sb, fm);
                     if (r instanceof CharSequence) {
                         out = (CharSequence) r;
                     }
                     done = true;
                     break;
                 }
             } catch (Throwable ignore) { }
             return done ? out : null;
         }
     }
