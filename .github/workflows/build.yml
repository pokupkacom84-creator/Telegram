             if not mm or not cm:
                 warn("FluxStyleActivity: не найдены точки вставки (matchWrap=%s, updateCells+springIn=%s) - переключатели не добавлены" % (bool(mm), bool(cm)))
             else:
                 call = cm.group(1) + "addFeaturesSection(list, context);\n"
                 a = a[:mm.start()] + SECTION_JAVA.lstrip("\n") + a[mm.start():]
                 cm = re.search(r'(?m)^([ \t]*)updateCells\(\);\n[ \t]*FluxStyle\.springIn\(root\);', a)
                 a = a[:cm.start()] + call + a[cm.start():]
                 wr(ap, a)
                 ok("FluxStyleActivity: секция «Дополнительные функции» (5 переключателей)")
     with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
         f.write("## FluxGram: 7 функций\n```\n" + "\n".join(report) + "\n```\n")
     if critical:
         print("::error::Критичные патчи не применились: " + "; ".join(critical))
         sys.exit(1)
     PY
  - name: Проверка, что хуки функций применились
    env:
     STRICT: ${{ inputs.strict_features }}
    run: |
     D=TMessagesProj/src/main/java/org/telegram
     miss=0
     chk() {
       if grep -rqF --include="$3" -- "$1" "$D"; then
         echo "OK   $2"
         echo "- ✅ $2" >> "$GITHUB_STEP_SUMMARY"
       else
         echo "::error::Хук не применён: $2"
         echo "- ❌ $2" >> "$GITHUB_STEP_SUMMARY"
         miss=1
       fi
     }
     echo "## Дополнительные функции: хуки" >> "$GITHUB_STEP_SUMMARY"
     chk "FluxViewOnce.shouldKeep(messageObject)" "view-once: не удалять после просмотра" SecretMediaViewer.java
     chk "FluxViewOnce.shouldKeep(currentMessageObject)" "view-once: без таймера уничтожения" SecretMediaViewer.java
     chk "FluxViewOnce.isProtected(" "view-once: файлы защищены от очистки" FileLoader.java
     chk "K_BYPASS_RESTRICT" "запрет копирования: MessagesController" MessagesController.java
     chk "K_BYPASS_RESTRICT" "запрет копирования: разбор TL (noforwards)" "*.java"
     chk "K_LOCAL_PREMIUM" "локальный Premium: UserConfig.isPremium" UserConfig.java
     chk "K_SPEED_BOOST" "ускорение загрузки: FileLoadOperation" FileLoadOperation.java
     chk "K_PROFILE_DETAILS" "ID, DC и дата регистрации в профиле" ProfileActivity.java
     chk "addFeaturesSection" "переключатели в «Визуал и стиль»" FluxStyleActivity.java
     chk "K_NO_PREMIUM_LOCK" "замки Premium сняты (EmojiView / ReactionsLayoutInBubble)" "*.java"
     chk "K_ALWAYS_TRANSLATE" "кнопка перевода для всех сообщений (MessageObject / TranslateAlert)" "*.java"
     chk "K_COPY_FORMATTED" "копировать с форматированием (FluxClip)" "*.java"
     chk "K_AUTO_REPLY_DELAYED" "автоответ с задержкой 5 мин (AutoReply)" "*.java"
     chk "K_UNLIMITED_PINS" "без лимита закреплённых чатов" "*.java"
     chk "K_UNLIMITED_FOLDERS" "без лимита папок" "*.java"
     chk "K_PROFILE_COLOR_FREE" "цвет профиля без Premium" "*.java"
     chk "K_CUSTOM_EMOJI_FREE" "статусные эмодзи без Premium" "*.java"
     chk "K_CHANNEL_STATS_ALWAYS" "статистика канала всегда" "*.java"
     chk "K_DELETED_MSG_CACHE" "FluxDeletedCache: кэш удалённых" "*.java"
     chk "K_BOT_BUTTON_COPY" "копировать текст inline-кнопки" "*.java"
     if [ "$miss" = 1 ] && [ "$STRICT" != "false" ]; then
       echo "::error::Часть функций не подключилась, сборка остановлена (отключается входом strict_features)"
       exit 1
     fi
  - name: Build APK
    run: |
     set -o pipefail
     chmod +x gradlew
     EXTRA=""
     if [ "$REBRAND" != "false" ] && [ -f rebrand.init.gradle ]; then
       EXTRA="-I rebrand.init.gradle"
     fi
     if [ -n "$ABI" ] && [ "$ABI" != "all" ]; then
       EXTRA="$EXTRA -Pandroid.injected.build.abi=$ABI"
     fi
     ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --console=plain --max-workers=4 $EXTRA \
       -PRELEASE_STORE_PASSWORD="$KS_STORE_PASS" \
       -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
       -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
       -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
       2>&1 | tee build.log
  - name: Краткая причина ошибки (если сборка упала)
    if: failure()
    run: |
     {
       echo "## Причина падения"
       for f in build.log native.log; do
         [ -f "$f" ] || continue
         echo "### $f"
         echo '```'
         awk '/\* What went wrong:/{p=1} p{print} /\* Try:/{p=0}' "$f" | head -40
         grep -nE "error:|Error:|fatal error|FAILED|No matching client|OutOfMemory|Could not|ninja: build stopped|cannot find symbol" "$f" | grep -v "^[0-9]*:\s*at " | head -40
         echo '```'
       done
     } | tee -a "$GITHUB_STEP_SUMMARY"
  - name: Найти готовые APK
    run: |
     mkdir -p out
     echo "=== все .apk / .aab в проекте ==="
     find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*' -not -path './out/*' | tee all_pkgs.txt
     echo "================================="
     grep -E 'TMessagesProj_App/build/outputs/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
     [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/build/intermediates/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
     [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/.*\.apk$' all_pkgs.txt > apk_list.txt || true
     [ -s apk_list.txt ] || grep -E '\.apk$' all_pkgs.txt > apk_list.txt || true
     while read -r f; do
       cp "$f" "out/$(basename "$(dirname "$f")")_$(basename "$f")"
     done < apk_list.txt
     ls -lh out
     if [ -z "$(ls -A out)" ]; then
       echo "::error::APK не найдены"
       ls -R TMessagesProj_App/build/intermediates 2>/dev/null | grep -iE "apk|package" | head -50
       exit 1
     fi
  - name: Zipalign + подпись APK (v1+v2+v3) и проверка
    run: |
     set -e
     BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
     BT="${BT%/}"
     echo "build-tools: $BT"
     KS="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
     mkdir -p signed
     for f in out/*.apk; do
       n="$(basename "$f" .apk)"
       "$BT/zipalign" -p -f 4 "$f" "signed/$n-aligned.apk"
       "$BT/apksigner" sign \
         --ks "$KS" --ks-key-alias "$KS_ALIAS" \
         --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
         --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
         --out "signed/$n.apk" "signed/$n-aligned.apk"
       rm -f "signed/$n-aligned.apk" "signed/$n.apk.idsig"
       "$BT/zipalign" -c -P 16 4 "signed/$n.apk" && echo "aligned OK: $n" || "$BT/zipalign" -c 4 "signed/$n.apk"
       "$BT/apksigner" verify -v --print-certs "signed/$n.apk" | head -12
       "$BT/aapt2" dump badging "signed/$n.apk" | grep -E "^package:|sdkVersion|targetSdk|native-code" || true
     done
     ls -lh signed
  - name: Проверка APK (название и новые функции)
    run: |
     BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
     BT="${BT%/}"
     fail=0
     for f in signed/*.apk; do
       BADGING="$("$BT/aapt2" dump badging "$f")"
       label="$(echo "$BADGING" | grep '^application-label' || true)"
       echo "$f -> $label"
       if [ "$REBRAND" != "false" ]; then
         if [ -z "$label" ] || echo "$label" | grep -qv "$APP_NAME"; then
           echo "::error::В $f название приложения не $APP_NAME: $label"
           fail=1
         fi
         if ! echo "$BADGING" | grep -q "^package: name='$APP_PACKAGE'"; then
           echo "::error::В $f пакет не $APP_PACKAGE"
           fail=1
         fi
       fi
       unzip -p "$f" 'classes*.dex' > /tmp/all.dex
       for str in "Автоответчик" "Копировать с форматированием" "Автопрокси" "no_premium_lock" "always_translate" \
                  "copy_formatted" "auto_reply_delayed" "unlimited_pins" "unlimited_folders" \
                  "profile_color_free" "custom_emoji_free" "channel_stats_always" \
                  "deleted_msg_cache" "bot_button_copy"; do
         if ! grep -aq "$str" /tmp/all.dex; then
           echo "::error::В $f нет функции: $str"
           fail=1
         fi
       done
     done
     exit $fail
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
     name: apk
     path: signed/*.apk
     if-no-files-found: error
  - name: Upload logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
     name: logs
     path: |
      build.log
      native.log
     if-no-files-found: ignore
 release:
  needs: build
  if: ${{ success() }}
  runs-on: ubuntu-latest
  timeout-minutes: 15
  permissions:
   contents: write
  steps:
  - name: Скачать APK
    uses: actions/download-artifact@v4
    with:
     name: apk
     path: apk
  - name: Создать GitHub Release и прикрепить APK
    env:
     GH_TOKEN: ${{ github.token }}
     RUN_NO: ${{ github.run_number }}
    run: |
     TAG="fluxgram-v1.0.${RUN_NO}"
     NOTES="Сборка FluxGram #${RUN_NO} (commit ${GITHUB_SHA::7}). Файлы: $(ls apk | tr '\n' ' ')"
     gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
     gh release create "$TAG" apk/*.apk \
       --repo "$GITHUB_REPOSITORY" \
       --title "FluxGram ${TAG}" \
       --notes "$NOTES" \
       --latest
