         public static void onPutUser(TLRPC.User u, long selfId) {
             if (u == null || u.id != selfId || !premiumOn()) {
                 return;
             }
             SharedPreferences p = prefs();
             String rk = "real_premium_" + u.id;
             if (p != null && !p.contains(rk)) {
                 p.edit().putBoolean(rk, u.premium).apply();
             }
