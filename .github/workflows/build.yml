         else:
             cache_java = r"""package org.telegram.messenger;

     import android.content.Context;
     import android.content.SharedPreferences;
     import android.util.LongSparseArray;

     import org.telegram.tgnet.TLRPC;

     import java.util.ArrayList;
     import java.util.HashSet;
     import java.util.Set;

     /**
      * FluxDeletedCache — отдельный от ShyMode слой кэша удалённых сообщений.
      * Управляется FluxStyle.K_DELETED_MSG_CACHE.
      */
     public final class FluxDeletedCache {

         private static final String PREFS = "flux_deleted_cache";
         private static final int MAX_ENTRIES = 5000;
         private static final LongSparseArray<Set<Integer>> CACHE = new LongSparseArray<>();
         private static boolean loaded;

         private FluxDeletedCache() { }

         private static SharedPreferences prefs() {
             Context c = ApplicationLoader.applicationContext;
             return c == null ? null : c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
         }

         private static synchronized void ensureLoaded() {
             if (loaded) return;
             loaded = true;
             try {
                 SharedPreferences p = prefs();
                 if (p == null) return;
                 for (String key : p.getAll().keySet()) {
                     try {
                         long did = Long.parseLong(key.split(":")[0]);
                         int mid = Integer.parseInt(key.split(":")[1]);
                         getOrCreate(did).add(mid);
                     } catch (Throwable ignore) { }
                 }
             } catch (Throwable ignore) { }
         }

         private static Set<Integer> getOrCreate(long dialogId) {
             Set<Integer> s = CACHE.get(dialogId);
             if (s == null) { s = new HashSet<>(); CACHE.put(dialogId, s); }
             return s;
         }

         /** Called from MessagesController.processUpdateArray on updateDeleteMessages */
         public static void onDeleted(long dialogId, ArrayList<Integer> msgIds) {
             if (!FluxStyle.bool(FluxStyle.K_DELETED_MSG_CACHE, true)) return;
             if (msgIds == null || msgIds.isEmpty()) return;
             ensureLoaded();
             SharedPreferences.Editor ed = null;
             SharedPreferences p = prefs();
             if (p != null) ed = p.edit();
             synchronized (FluxDeletedCache.class) {
                 Set<Integer> set = getOrCreate(dialogId);
                 for (int id : msgIds) {
                     if (set.size() < MAX_ENTRIES) {
                         set.add(id);
                         if (ed != null) ed.putBoolean(dialogId + ":" + id, true);
                     }
                 }
             }
             if (ed != null) ed.apply();
         }

         public static boolean isDeleted(long dialogId, int msgId) {
             if (!FluxStyle.bool(FluxStyle.K_DELETED_MSG_CACHE, true)) return false;
             ensureLoaded();
             synchronized (FluxDeletedCache.class) {
                 Set<Integer> s = CACHE.get(dialogId);
                 return s != null && s.contains(msgId);
             }
         }

         /** Decorate timestamp shown in ChatMessageCell */
         public static String decorateTime(MessageObject mo, String time) {
             if (mo == null || mo.messageOwner == null) return time;
             if (isDeleted(mo.getDialogId(), mo.getId())) {
                 return "\uD83D\uDDD1 удалено" + (time == null || time.isEmpty() ? "" : ", " + time);
             }
             return time;
         }
     }
     """
             wr(cache_path, cache_java)
             ok("FluxDeletedCache.java создан (K_DELETED_MSG_CACHE)")
