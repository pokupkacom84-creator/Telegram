         private void choose(int hue, int sat) {
             FluxFeatures.setSeed(ctx, hue, sat);
             rebuildStack();
             updateUi(true);
         }
         private void updateUi(boolean setBars) {
             int hue = FluxFeatures.seedHue(ctx);
             int sat = FluxFeatures.seedSat(ctx);
             if (hue >= 0) {
                 if (setBars) {
                     hueBar.setProgress(hue);
                     satBar.setProgress(sat);
                 }
                 hueLabel.setText("Оттенок: " + hue + "°");
             } else {
                 if (setBars) {
                     hueBar.setProgress(205);
                     satBar.setProgress(48);
                 }
                 hueLabel.setText("Оттенок: системный (обои)");
             }
             for (Swatch sw : swatches) {
                 sw.invalidate();
             }
             preview.invalidate();
             styleDice();
         }
         private void styleDice() {
             if (dice == null) {
                 return;
             }
             boolean dark = FluxFeatures.isDark(ctx);
             GradientDrawable g = new GradientDrawable();
             g.setCornerRadius(AndroidUtilities.dp(26));
             g.setColor(FluxFeatures.preview(ctx, Role.PRIMARY_CONTAINER, dark));
             dice.setBackground(g);
             dice.setTextColor(FluxFeatures.preview(ctx, Role.ON_PRIMARY_CONTAINER, dark));
         }
         private LinearLayout.LayoutParams matchWrap() {
             return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
         }
         private TextCheckCell newCell() {
             TextCheckCell cell = new TextCheckCell(ctx);
             cell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             return cell;
         }
         private void addHeader(String title) {
             HeaderCell header = new HeaderCell(ctx);
