             long now = SystemClock.uptimeMillis();
             Long at = EDIT_TIME.get(key);
             Boolean cached = EDIT_CACHE.get(key);
             if (at != null && cached != null && now - at < 5000) {
                 return cached;
             }
             boolean r = SpyMode.hasEdits(mo);
             if (EDIT_CACHE.size() > 400) {
                 EDIT_CACHE.clear();
                 EDIT_TIME.clear();
             }
             EDIT_CACHE.put(key, r);
             EDIT_TIME.put(key, now);
             return r;
