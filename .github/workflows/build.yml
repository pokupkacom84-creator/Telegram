name: Build APK (Telegram fork)

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Какие архитектуры собирать (arm64-v8a — быстрее всего)"
        type: choice
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      rebrand:
        description: "Сменить имя пакета и название приложения"
        type: boolean
        default: true
      ghost_read:
        description: "Призрак: не отправлять «прочитано» (чаты, голосовые)"
        type: boolean
        default: true
      ghost_typing:
        description: "Призрак: не показывать «печатает…»"
        type: boolean
        default: true
      ghost_online:
        description: "Призрак: не показывать «в сети»"
        type: boolean
        default: true
      ghost_stories:
        description: "Призрак: не отмечать истории просмотренными"
        type: boolean
        default: true
      ghost_offline:
        description: "Призрак: автоматический «офлайн» после отправки сообщения"
        type: boolean
        default: false

env:
  APP_NAME: FluxGram
  APP_PACKAGE: com.fluxgram.app
  ABI: ${{ inputs.abi }}
  REBRAND: ${{ inputs.rebrand }}
  GHOST_READ: ${{ inputs.ghost_read }}
  GHOST_TYPING: ${{ inputs.ghost_typing }}
  GHOST_ONLINE: ${{ inputs.ghost_online }}
  GHOST_STORIES: ${{ inputs.ghost_stories }}
  GHOST_OFFLINE: ${{ inputs.ghost_offline }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm yasm make cmake perl pkg-config

      - name: Android SDK / NDK (версии берём из проекта)
        run: |
          set +e
          G=$(find . -name '*.gradle' -not -path './TMessagesProj/jni/*' -not -path './.git/*')
          NDK_VER=$(grep -hE "ndkVersion" $G gradle.properties 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SDK_VER=$(grep -hE "compileSdk(Version)?[ =]+[0-9]+" $G 2>/dev/null | grep -oE '[0-9]+' | head -1)
          BT_VER=$(grep -hoE "buildToolsVersion[ =]+['\"][0-9.]+" $G 2>/dev/null | grep -oE '[0-9.]+$' | head -1)
          NDK_VER=${NDK_VER:-27.2.12479018}
          SDK_VER=${SDK_VER:-36}
          BT_VER=${BT_VER:-36.0.0}
          echo "ndk=$NDK_VER compileSdk=$SDK_VER buildTools=$BT_VER"

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1
          for pkg in "platforms;android-$SDK_VER" "build-tools;$BT_VER" "ndk;$NDK_VER" "cmake;3.22.1"; do
            echo ">>> sdkmanager $pkg"
            "$SDKM" --install "$pkg" > /dev/null || echo "WARN: не удалось поставить $pkg (gradle попробует сам)"
          done

          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            echo "::error::NDK $NDK_VER не установился"
            ls "$ANDROID_HOME/ndk" || true
            exit 1
          fi
          echo "NDK_VER=$NDK_VER" >> "$GITHUB_ENV"

      - name: Ребрендинг (имя пакета, название, google-services.json)
        if: ${{ env.REBRAND != 'false' }}
        run: |
          python3 - <<'PY'
          import re, glob, json, os
          pkg = os.environ["APP_PACKAGE"]
          name = os.environ["APP_NAME"]

          # applicationId во всех build.gradle (кроме jni)
          for f in glob.glob("**/build.gradle", recursive=True):
              if f.startswith(".git") or "/jni/" in f or f.startswith("TMessagesProj/jni"):
                  continue
              s = open(f, encoding="utf-8").read()
              n = re.sub(r'(?m)^(\s*applicationId\s*=?\s*)(["\'])[^"\']*\2',
                         lambda m: m.group(1) + '"' + pkg + '"', s)
              if n != s:
                  open(f, "w", encoding="utf-8").write(n)
                  print("applicationId ->", f)

          # google-services.json должен содержать новый package_name,
          # иначе сборка падает с "No matching client found for package name"
          for f in glob.glob("**/google-services.json", recursive=True):
              if f.startswith(".git"):
                  continue
              import copy
              d = json.load(open(f, encoding="utf-8"))
              clients = d.get("client", [])
              extra = copy.deepcopy(clients[0])
              extra["client_info"]["android_client_info"]["package_name"] = pkg
              # оставляем исходные клиенты и добавляем клиент с новым именем пакета
              d["client"] = clients + [extra]
              json.dump(d, open(f, "w", encoding="utf-8"), indent=2)
              print("google-services ->", f, [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]])

          # Huawei-модуль проверяет agconnect-services.json (на случай, если он всё же собирается)
          for f in glob.glob("**/agconnect-services.json", recursive=True):
              if f.startswith(".git"):
                  continue
              d = json.load(open(f, encoding="utf-8"))
              if isinstance(d.get("client"), dict):
                  d["client"]["package_name"] = pkg
                  json.dump(d, open(f, "w", encoding="utf-8"), indent=2)
                  print("agconnect ->", f, pkg)

          # Gradle init-скрипт: принудительно задаёт applicationId,
          # где бы он ни был объявлен в проекте
          open("rebrand.init.gradle", "w").write('''
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      def pkg = System.getenv('APP_PACKAGE')
                      p.android.defaultConfig.applicationId = pkg
                      p.android.productFlavors.each { f ->
                          if (f.applicationId != null) { f.applicationId = pkg }
                          f.applicationIdSuffix = null
                      }
                      p.android.buildTypes.each { b -> b.applicationIdSuffix = null }
                      println "REBRAND: " + p.path + " applicationId=" + pkg
                  }
              }
          }
          '''.replace("\n          ", "\n"))

          # название приложения
          p = "TMessagesProj/src/main/res/values/strings.xml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(<string name="AppName(?:Beta)?"[^>]*>)[^<]*', lambda m: m.group(1) + name, s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -rn "applicationId" --include=build.gradle . | grep -v jni || true
          grep -n 'name="AppName' TMessagesProj/src/main/res/values/strings.xml || true

      - name: Режим призрака (патч исходников)
        run: |
          python3 - <<'PY'
          import re, os, sys

          def flag(name, default):
              return os.environ.get(name, default) == "true"

          READ = flag("GHOST_READ", "true")
          TYPING = flag("GHOST_TYPING", "true")
          ONLINE = flag("GHOST_ONLINE", "true")
          STORIES = flag("GHOST_STORIES", "true")
          OFFLINE = flag("GHOST_OFFLINE", "false")
          print("ghost defaults: read=%s stories=%s online=%s typing=%s offline=%s" % (READ, STORIES, ONLINE, TYPING, OFFLINE))

          tg = "TMessagesProj/src/main/java/org/telegram/tgnet"
          tlrpc = open(tg + "/TLRPC.java", encoding="utf-8").read()

          def has(name):
              ok = re.search(r'class\s+' + name + r'\b', tlrpc) is not None
              print(("  найден    " if ok else "  НЕ найден ") + name)
              return ok

          cases = []
          offline_impl = "private static void sendOffline() { }"

          # --- чтение сообщений: запрос не уходит, но запоминается (для «Читать при действиях»)
          if has("TL_messages_readHistory"):
              cases.append('if (req instanceof TLRPC.TL_messages_readHistory) { if (on(KEY_READ)) { remember(peerKey(((TLRPC.TL_messages_readHistory) req).peer), req); return true; } return false; }')
          if has("TL_channels_readHistory"):
              cases.append('if (req instanceof TLRPC.TL_channels_readHistory) { if (on(KEY_READ)) { TLRPC.InputChannel ch = ((TLRPC.TL_channels_readHistory) req).channel; remember(ch == null ? null : "c" + ch.channel_id, req); return true; } return false; }')
          for n in ("TL_messages_readMessageContents", "TL_channels_readMessageContents"):
              if has(n):
                  cases.append('if (req instanceof TLRPC.%s) return on(KEY_READ);' % n)

          # --- истории
          for n in ("TL_stories_readStories", "TL_stories_incrementStoryViews"):
              if has(n):
                  cases.append('if (req instanceof TLRPC.%s) return on(KEY_STORIES);' % n)

          # --- «печатает»
          if has("TL_messages_setTyping"):
              cases.append('if (req instanceof TLRPC.TL_messages_setTyping) return on(KEY_TYPING);')

          # --- «онлайн»
          if has("TL_account_updateStatus"):
              cases.append('if (req instanceof TLRPC.TL_account_updateStatus) { if (on(KEY_ONLINE)) { ((TLRPC.TL_account_updateStatus) req).offline = true; } return false; }')
              offline_impl = """private static void sendOffline() {
                  AndroidUtilities.runOnUIThread(new Runnable() {
                      @Override
                      public void run() {
                          TLRPC.TL_account_updateStatus r = new TLRPC.TL_account_updateStatus();
                          r.offline = true;
                          ConnectionsManager.getInstance(UserConfig.selectedAccount).sendRequest(r, new RequestDelegate() {
                              @Override
                              public void run(TLObject response, TLRPC.TL_error error) { }
                          });
                      }
                  }, 1500);
              }"""

          # --- отправка сообщений / реакции: «читать при действиях», «офлайн», «без звука»
          sends = [("TL_messages_sendMessage", "peer", True),
                   ("TL_messages_sendMedia", "peer", True),
                   ("TL_messages_sendMultiMedia", "peer", True),
                   ("TL_messages_forwardMessages", "to_peer", True),
                   ("TL_messages_sendReaction", "peer", False)]
          for n, field, silent in sends:
              if has(n):
                  body = 'TLRPC.%s r = (TLRPC.%s) req; onAction(peerKey(r.%s));' % (n, n, field)
                  if silent:
                      body += ' if (get(KEY_SILENT)) { r.silent = true; }'
                  cases.append('if (req instanceof TLRPC.%s) { %s return false; }' % (n, body))

          java = """package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.telegram.tgnet.ConnectionsManager;
          import org.telegram.tgnet.RequestDelegate;
          import org.telegram.tgnet.TLObject;
          import org.telegram.tgnet.TLRPC;

          import java.util.concurrent.ConcurrentHashMap;

          public class GhostMode {
              public static final String KEY_GHOST = "ghost_enabled";
              public static final String KEY_READ = "ghost_read";
              public static final String KEY_STORIES = "ghost_stories";
              public static final String KEY_ONLINE = "ghost_online";
              public static final String KEY_TYPING = "ghost_typing";
              public static final String KEY_OFFLINE = "ghost_offline";
              public static final String KEY_ACTION_READ = "ghost_read_on_action";
              public static final String KEY_SILENT = "send_silent";

              // последний «прочитано» по каждому чату, который мы не отправили
              private static final ConcurrentHashMap<String, TLObject> PENDING = new ConcurrentHashMap<>();
              private static final ThreadLocal<Boolean> BYPASS = new ThreadLocal<>();

              private static SharedPreferences prefs() {
                  Context c = ApplicationLoader.applicationContext;
                  return c == null ? null : c.getSharedPreferences("ghostmode", Context.MODE_PRIVATE);
              }

              private static boolean def(String key) {
                  if (KEY_GHOST.equals(key)) return true;
                  if (KEY_READ.equals(key)) return @READ@;
                  if (KEY_STORIES.equals(key)) return @STORIES@;
                  if (KEY_ONLINE.equals(key)) return @ONLINE@;
                  if (KEY_TYPING.equals(key)) return @TYPING@;
                  if (KEY_OFFLINE.equals(key)) return @OFFLINE@;
                  return false;
              }

              public static boolean get(String key) {
                  SharedPreferences p = prefs();
                  return p == null ? def(key) : p.getBoolean(key, def(key));
              }

              public static void set(String key, boolean value) {
                  SharedPreferences p = prefs();
                  if (p != null) {
                      p.edit().putBoolean(key, value).apply();
                  }
              }

              /** функция работает, если включён общий режим призрака и сам пункт */
              private static boolean on(String key) {
                  return get(KEY_GHOST) && get(key);
              }

              private static String peerKey(TLRPC.InputPeer p) {
                  if (p == null) return null;
                  if (p.channel_id != 0) return "c" + p.channel_id;
                  if (p.chat_id != 0) return "g" + p.chat_id;
                  return "u" + p.user_id;
              }

              private static void remember(String key, TLObject req) {
                  if (key != null) {
                      PENDING.put(key, req);
                  }
              }

              private static void onAction(String key) {
                  if (key != null && get(KEY_ACTION_READ)) {
                      TLObject pending = PENDING.remove(key);
                      if (pending != null) {
                          BYPASS.set(Boolean.TRUE);
                          try {
                              ConnectionsManager.getInstance(UserConfig.selectedAccount).sendRequest(pending, new RequestDelegate() {
                                  @Override
                                  public void run(TLObject response, TLRPC.TL_error error) { }
                              });
                          } finally {
                              BYPASS.set(Boolean.FALSE);
                          }
                      }
                  }
                  if (on(KEY_OFFLINE)) {
                      sendOffline();
                  }
              }

              @OFFLINE_IMPL@

              /** true = запрос не отправлять на сервер */
              public static boolean drop(TLObject req) {
                  if (req == null) return false;
                  if (Boolean.TRUE.equals(BYPASS.get())) return false;
                  @CHECKS@
                  return false;
              }
          }
          """
          java = (java.replace("@READ@", str(READ).lower())
                      .replace("@STORIES@", str(STORIES).lower())
                      .replace("@ONLINE@", str(ONLINE).lower())
                      .replace("@TYPING@", str(TYPING).lower())
                      .replace("@OFFLINE@", str(OFFLINE).lower())
                      .replace("@OFFLINE_IMPL@", offline_impl)
                      .replace("@CHECKS@", "\n        ".join(cases)))
          open("TMessagesProj/src/main/java/org/telegram/messenger/GhostMode.java", "w", encoding="utf-8").write(java)

          cm = tg + "/ConnectionsManager.java"
          src = open(cm, encoding="utf-8").read()
          pat = re.compile(r'(public\s+(?:synchronized\s+)?int\s+sendRequest\w*\s*\(\s*(?:final\s+)?(?:org\.telegram\.tgnet\.)?TLObject\s+(\w+)\s*,[^{;]*?\)\s*(?:throws[^{]*)?\{)', re.S)
          count = [0]
          def rep(m):
              count[0] += 1
              return m.group(1) + "\n        if (org.telegram.messenger.GhostMode.drop(%s)) { return 0; }" % m.group(2)
          new = pat.sub(rep, src)
          print("ConnectionsManager: пропатчено методов:", count[0])
          if count[0] == 0:
              print("::error::Не нашёл sendRequest в ConnectionsManager. Сигнатуры:")
              for l in src.splitlines():
                  if "sendRequest" in l and ("public" in l or "private" in l):
                      print("   ", l.strip())
              sys.exit(1)
          open(cm, "w", encoding="utf-8").write(new)
          PY
          echo "--- GhostMode.java ---"
          cat TMessagesProj/src/main/java/org/telegram/messenger/GhostMode.java
          echo "--- хуки ---"
          grep -n "GhostMode" TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java

      - name: Пункт «FluxGram» в настройках приложения
        run: |
          python3 - <<'PY'
          import re, os, glob

          # Пункт «FluxGram» в настройках приложения (мягкий патч:
          # если что-то не нашлось — пункт не добавляется, сборка продолжается).
          base = "TMessagesProj/src/main/java/org/telegram/ui"
          sa_path = base + "/SettingsActivity.java"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          def report(msg):
              print(msg)
              if summary:
                  open(summary, "a", encoding="utf-8").write(msg + "\n\n")

          def bail(why):
              report("⚠️ Пункт «FluxGram» НЕ добавлен: " + why + " (призрак по build-флагам работает)")
              raise SystemExit(0)

          if not os.path.exists(sa_path):
              bail("нет SettingsActivity.java")

          # проверяем, что нужные классы и ресурсы есть в этой версии
          need_files = [base + "/Cells/TextCheckCell.java", base + "/Cells/HeaderCell.java",
                        base + "/ActionBar/BaseFragment.java", base + "/ActionBar/ActionBar.java",
                        base + "/ActionBar/Theme.java"]
          for f in need_files:
              if not os.path.exists(f):
                  bail("нет файла " + f)
          theme = open(base + "/ActionBar/Theme.java", encoding="utf-8").read()
          if "key_windowBackgroundGray" not in theme or "key_windowBackgroundWhite" not in theme or "key_windowBackgroundWhiteGrayText4" not in theme:
              bail("нет ключей темы")
          ab = open(base + "/ActionBar/ActionBar.java", encoding="utf-8").read()
          if "ActionBarMenuOnItemClick" not in ab or "setAllowOverlayTitle" not in ab:
              bail("другой API ActionBar")
          tcc = open(base + "/Cells/TextCheckCell.java", encoding="utf-8").read()
          if "setTextAndCheck(" not in tcc:
              bail("нет TextCheckCell.setTextAndCheck")
          hc = open(base + "/Cells/HeaderCell.java", encoding="utf-8").read()
          if "void setText(" not in hc:
              bail("нет HeaderCell.setText")

          res = "TMessagesProj/src/main/res"
          def drawable_exists(n):
              return bool(glob.glob(res + "/drawable*/" + n + ".*"))
          if not drawable_exists("ic_ab_back"):
              bail("нет ic_ab_back")
          icon = None
          for cand in ("msg2_ghost", "msg_ghost", "msg_secret", "msg_settings_old", "msg_settings"):
              if drawable_exists(cand):
                  icon = cand
                  break
          if not icon:
              bail("не нашёл иконку")
          print("иконка:", icon)

          # --- фрагмент настроек ---
          frag = """package org.telegram.ui;

          import android.content.Context;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.telegram.messenger.AndroidUtilities;
          import org.telegram.messenger.GhostMode;
          import org.telegram.messenger.R;
          import org.telegram.ui.ActionBar.ActionBar;
          import org.telegram.ui.ActionBar.BaseFragment;
          import org.telegram.ui.ActionBar.Theme;
          import org.telegram.ui.Cells.HeaderCell;
          import org.telegram.ui.Cells.TextCheckCell;

          import java.util.ArrayList;

          public class GhostSettingsActivity extends BaseFragment {

              private static final String[] SUB_KEYS = {
                      GhostMode.KEY_READ, GhostMode.KEY_STORIES, GhostMode.KEY_ONLINE,
                      GhostMode.KEY_TYPING, GhostMode.KEY_OFFLINE
              };
              private static final String[] SUB_TITLES = {
                      "Не читать сообщения", "Не читать истории", "Не отправлять «онлайн»",
                      "Не отправлять «печатает»", "Автоматический «офлайн»"
              };

              private TextCheckCell master;
              private final ArrayList<TextCheckCell> subCells = new ArrayList<>();

              @Override
              public View createView(Context context) {
                  actionBar.setBackButtonImage(R.drawable.ic_ab_back);
                  actionBar.setAllowOverlayTitle(true);
                  actionBar.setTitle("FluxGram");
                  actionBar.setActionBarMenuOnItemClick(new ActionBar.ActionBarMenuOnItemClick() {
                      @Override
                      public void onItemClick(int id) {
                          if (id == -1) {
                              finishFragment();
                          }
                      }
                  });

                  FrameLayout root = new FrameLayout(context);
                  root.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundGray));
                  fragmentView = root;

                  ScrollView scroll = new ScrollView(context);
                  root.addView(scroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout list = new LinearLayout(context);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  addHeader(list, context, "Режим призрака");

                  master = newCell(context);
                  master.setOnClickListener(v -> {
                      boolean value = !GhostMode.get(GhostMode.KEY_GHOST);
                      GhostMode.set(GhostMode.KEY_GHOST, value);
                      for (String k : SUB_KEYS) {
                          GhostMode.set(k, value);
                      }
                      refresh();
                  });
                  list.addView(master, matchWrap());

                  for (int i = 0; i < SUB_KEYS.length; i++) {
                      final String key = SUB_KEYS[i];
                      TextCheckCell cell = newCell(context);
                      cell.setTextAndCheck(SUB_TITLES[i], GhostMode.get(key), i < SUB_KEYS.length - 1);
                      cell.setOnClickListener(v -> {
                          GhostMode.set(key, !GhostMode.get(key));
                          int n = 0;
                          for (String k : SUB_KEYS) {
                              if (GhostMode.get(k)) n++;
                          }
                          GhostMode.set(GhostMode.KEY_GHOST, n > 0);
                          refresh();
                      });
                      subCells.add(cell);
                      list.addView(cell, matchWrap());
                  }
                  addNote(list, context, "Режим призрака включает или выключает все пункты сразу. Каждый пункт можно настроить отдельно.");

                  addSwitch(list, context, "Читать при действиях", GhostMode.KEY_ACTION_READ);
                  addNote(list, context, "Читает чат, когда вы отправляете сообщение или ставите реакцию.");

                  addSwitch(list, context, "Отправлять без звука", GhostMode.KEY_SILENT);
                  addNote(list, context, "Все сообщения по умолчанию отправляются без звука.");

                  refresh();
                  return fragmentView;
              }

              private void refresh() {
                  int n = 0;
                  for (int i = 0; i < SUB_KEYS.length; i++) {
                      boolean v = GhostMode.get(SUB_KEYS[i]);
                      if (v) n++;
                      subCells.get(i).setChecked(v);
                  }
                  master.setTextAndCheck("Режим призрака  " + n + "/" + SUB_KEYS.length, GhostMode.get(GhostMode.KEY_GHOST), true);
              }

              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              private TextCheckCell newCell(Context context) {
                  TextCheckCell cell = new TextCheckCell(context);
                  cell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  return cell;
              }

              private void addHeader(LinearLayout list, Context context, String title) {
                  HeaderCell header = new HeaderCell(context);
                  header.setText(title);
                  header.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  list.addView(header, matchWrap());
              }

              private void addSwitch(LinearLayout list, Context context, String title, final String key) {
                  final TextCheckCell cell = newCell(context);
                  cell.setTextAndCheck(title, GhostMode.get(key), false);
                  cell.setOnClickListener(v -> {
                      boolean value = !GhostMode.get(key);
                      GhostMode.set(key, value);
                      cell.setChecked(value);
                  });
                  list.addView(cell, matchWrap());
              }

              private void addNote(LinearLayout list, Context context, String text) {
                  TextView note = new TextView(context);
                  note.setText(text);
                  note.setTextSize(14);
                  note.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
                  note.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(10), AndroidUtilities.dp(21), AndroidUtilities.dp(16));
                  list.addView(note, matchWrap());
              }
          }
          """

          # --- патч SettingsActivity ---
          orig = open(sa_path, encoding="utf-8").read()
          TITLE = "FluxGram"

          def try_patch(X):
              s = orig
              # 1) поле
              m = re.search(r'class\s+SettingsActivity\s+extends[^{]*\{', s)
              if not m:
                  return None, "не нашёл объявление класса"
              s = s[:m.end()] + "\n    private int ghostRow = -1;\n" + s[m.end():]

              # 2) строка в updateRows()
              anchor = X + " = rowCount++;"
              if anchor not in s:
                  return None, "нет '%s'" % anchor
              s = s.replace(anchor, "ghostRow = rowCount++;\n        " + anchor, 1)

              # 3) обработчики клика / отрисовки
              pat = re.compile(r'(else\s+)?if\s*\(\s*position\s*==\s*' + X + r'\s*\)\s*\{')
              clicks = [0]; binds = [0]
              out = []; last = 0
              for m in pat.finditer(s):
                  look = s[m.end(): m.end() + 260]
                  pre = m.group(1) or ""
                  ip = look.find("presentFragment")
                  it = look.find("setTextAndIcon")
                  if ip != -1 and (it == -1 or ip < it):
                      body = "presentFragment(new GhostSettingsActivity());"
                      clicks[0] += 1
                  else:
                      mm = re.search(r'(\w+)\.setTextAndIcon\s*\(', look)
                      if not mm:
                          continue
                      body = '%s.setTextAndIcon("%s", R.drawable.%s, true);' % (mm.group(1), TITLE, icon)
                      binds[0] += 1
                  out.append(s[last:m.start()])
                  out.append("%sif (position == ghostRow) { %s } else if (position == %s) {" % (pre, body, X))
                  last = m.end()
              out.append(s[last:])
              s = "".join(out)
              if clicks[0] < 1 or binds[0] < 1:
                  return None, "клик=%d отрисовка=%d" % (clicks[0], binds[0])

              # 4) тип ячейки (getItemViewType)
              vt = re.compile(r'position\s*==\s*' + X + r'\s*\|\|')
              if not vt.search(s):
                  return None, "нет '%s ||' в getItemViewType" % X
              s = vt.sub("position == ghostRow || position == " + X + " ||", s, count=1)
              return s, "ok (клик=%d, отрисовка=%d)" % (clicks[0], binds[0])

          result = None
          log = []
          for X in ("notificationRow", "privacyRow", "languageRow", "dataRow", "chatRow"):
              r, msg = try_patch(X)
              log.append("  %s: %s" % (X, msg))
              if r is not None:
                  result = (X, r)
                  break
          print("\n".join(log))
          if result is None:
              print("--- строки с Row в SettingsActivity (для отладки) ---")
              for i, l in enumerate(orig.splitlines()):
                  if re.search(r'position\s*==\s*\w+Row', l) or "rowCount++" in l:
                      print("%5d  %s" % (i + 1, l.strip()))
                      if i > 400: break
              bail("не нашёл якоря в SettingsActivity")

          open(base + "/GhostSettingsActivity.java", "w", encoding="utf-8").write(frag)
          open(sa_path, "w", encoding="utf-8").write(result[1])
          report("✅ Пункт «%s» добавлен в настройки (якорь: %s, иконка: %s)" % (TITLE, result[0], icon))
          PY

      - name: API ключи (необязательно, из secrets APP_ID / APP_HASH)
        env:
          S_APP_ID: ${{ secrets.APP_ID }}
          S_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -n "$S_APP_ID" ] && [ -n "$S_APP_HASH" ]; then
            printf 'APP_ID = %s\nAPP_HASH = %s\n' "$S_APP_ID" "$S_APP_HASH" > API_KEYS
            python3 - <<'PY'
          import re, os
          p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(APP_ID\s*=\s*)\d+', lambda m: m.group(1) + os.environ["S_APP_ID"], s, count=1)
          s = re.sub(r'(APP_HASH\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + os.environ["S_APP_HASH"] + '"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("BuildVars обновлён")
          PY
          else
            echo "Secrets APP_ID/APP_HASH не заданы — используются ключи из репозитория"
          fi

      - name: Keystore для подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
            echo "KS_STORE_PASS=${S_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${S_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${S_KEY_PASS}" >> "$GITHUB_ENV"
            echo "Используется ваш keystore из secrets"
          else
            rm -f TMessagesProj/config/release.keystore
            keytool -genkeypair -noprompt -keystore TMessagesProj/config/release.keystore \
              -alias fluxgram -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android123 -keypass android123 -dname "CN=FluxGram, O=FluxGram, C=US"
            echo "KS_STORE_PASS=android123" >> "$GITHUB_ENV"
            echo "KS_ALIAS=fluxgram" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=android123" >> "$GITHUB_ENV"
            echo "Создан временный keystore (для обновлений между сборками задайте KEYSTORE_BASE64)"
          fi

      - name: Нативные библиотеки (libvpx, ffmpeg, boringssl)
        working-directory: TMessagesProj/jni
        run: |
          set -o pipefail
          export NDK="$ANDROID_HOME/ndk/$NDK_VER"
          export ANDROID_NDK_HOME="$NDK"
          export NINJA_PATH="$(command -v ninja)"
          echo "NDK=$NDK"
          run_script() {
            if [ ! -f "$1" ]; then echo "SKIP (нет файла): $1"; return 0; fi
            echo ">>> $1"
            chmod +x "$1"
            "./$1"
          }
          {
            run_script build_libvpx_clang.sh
            run_script build_ffmpeg_clang.sh
            run_script patch_ffmpeg.sh
            run_script patch_boringssl.sh
            run_script build_boringssl.sh
          } 2>&1 | tee "$GITHUB_WORKSPACE/native.log"

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          EXTRA=""
          if [ "$REBRAND" != "false" ] && [ -f rebrand.init.gradle ]; then
            EXTRA="-I rebrand.init.gradle"
          fi
          if [ -n "$ABI" ] && [ "$ABI" != "all" ]; then
            EXTRA="$EXTRA -Pandroid.injected.build.abi=$ABI"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --console=plain --max-workers=4 $EXTRA \
            -PRELEASE_STORE_PASSWORD="$KS_STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee build.log

      - name: Краткая причина ошибки (если сборка упала)
        if: failure()
        run: |
          {
            echo "## Причина падения"
            for f in build.log native.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              awk '/\* What went wrong:/{p=1} p{print} /\* Try:/{p=0}' "$f" | head -40
              grep -nE "error:|Error:|fatal error|FAILED|No matching client|OutOfMemory|Could not|ninja: build stopped|cannot find symbol" "$f" | grep -v "^[0-9]*:\s*at " | head -40
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Найти готовые APK
        run: |
          mkdir -p out
          echo "=== все .apk / .aab в проекте ==="
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*' -not -path './out/*' | tee all_pkgs.txt
          echo "================================="
          # приоритет: outputs/apk, затем intermediates/apk, затем любые *.apk приложения
          grep -E 'TMessagesProj_App/build/outputs/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/build/intermediates/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E '\.apk$' all_pkgs.txt > apk_list.txt || true
          while read -r f; do
            cp "$f" "out/$(basename "$(dirname "$f")")_$(basename "$f")"
          done < apk_list.txt
          ls -lh out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::APK не найдены"
            ls -R TMessagesProj_App/build/intermediates 2>/dev/null | grep -iE "apk|package" | head -50
            exit 1
          fi

      - name: Zipalign + подпись APK (v1+v2+v3) и проверка
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          BT="${BT%/}"
          echo "build-tools: $BT"
          KS="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
          mkdir -p signed
          for f in out/*.apk; do
            n="$(basename "$f" .apk)"
            "$BT/zipalign" -p -f 4 "$f" "signed/$n-aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$n.apk" "signed/$n-aligned.apk"
            rm -f "signed/$n-aligned.apk" "signed/$n.apk.idsig"
            "$BT/zipalign" -c -P 16 4 "signed/$n.apk" && echo "aligned OK: $n" || "$BT/zipalign" -c 4 "signed/$n.apk"
            "$BT/apksigner" verify -v --print-certs "signed/$n.apk" | head -12
            "$BT/aapt2" dump badging "signed/$n.apk" | grep -E "^package:|sdkVersion|targetSdk|native-code" || true
          done
          ls -lh signed

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: signed/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            native.log
          if-no-files-found: ignore

  # Пробная установка в эмулятор Android 16: показывает настоящую причину,
  # если APK не ставится. Работает только когда в APK есть x86_64 (abi = all или x86_64).
  install-test:
    needs: build
    if: ${{ inputs.abi == 'all' || inputs.abi == 'x86_64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скрипт проверки
        run: |
          cat > install_test.sh <<'SH'
          adb logcat -c
          for f in apk/*.apk; do echo "=== $f" | tee -a install.log; adb install -r "$f" 2>&1 | tee -a install.log; done
          adb logcat -d | grep -iE "PackageManager|PackageInstaller|installd|INSTALL_" | tail -150 >> install.log
          adb shell pm list packages | grep -i fluxgram | tee -a install.log || true
          SH
          chmod +x install_test.sh

      - name: Установка в эмулятор Android 16
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./install_test.sh

      - name: Результат установки
        if: always()
        run: cat install.log || echo "install.log не создан"

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: install.log
          if-no-files-found: ignore
