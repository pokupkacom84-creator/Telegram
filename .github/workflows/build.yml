         public static void springScale(final View v, final float from, long duration, float pivotX, float pivotY) {
             try {
                 ValueAnimator old = ANIMS.get(v);
                 if (old != null) {
                     old.cancel();
                 }
                 v.setPivotX(pivotX);
                 v.setPivotY(pivotY);
                 final ValueAnimator a = ValueAnimator.ofFloat(0f, 1f);
                 a.setDuration(duration);
                 a.setInterpolator(SPRING);
                 a.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                     @Override
                     public void onAnimationUpdate(ValueAnimator an) {
                         float s = from + (1f - from) * (Float) an.getAnimatedValue();
                         v.setScaleX(s);
                         v.setScaleY(s);
                     }
                 });
                 a.addListener(new AnimatorListenerAdapter() {
                     @Override
                     public void onAnimationEnd(Animator animation) {
                         v.setScaleX(1f);
                         v.setScaleY(1f);
                         ANIMS.remove(v);
                     }

                     @Override
                     public void onAnimationCancel(Animator animation) {
                         v.setScaleX(1f);
                         v.setScaleY(1f);
                     }
                 });
                 ANIMS.put(v, a);
                 a.start();
             } catch (Throwable ignore) {
             }
         }

