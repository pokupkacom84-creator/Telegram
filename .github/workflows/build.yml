          def warn(msg):
              print("::warning::" + msg)
              p = os.environ.get("GITHUB_STEP_SUMMARY")
              if p:
                  open(p, "a", encoding="utf-8").write("⚠️ " + msg + "\n\n")

          ui = "TMessagesProj/src/main/java/org/telegram/ui"

          # --- пометка «🗑 удалено» рядом со временем сообщения
          cell = ui + "/Cells/ChatMessageCell.java"
          s = open(cell, encoding="utf-8").read()
          pat = re.compile(r'(\btimeString\s*=\s*timeString\(\s*currentMessageObject\s*,\s*messageObject\s*,\s*edited\s*,[^;]*;)')
          n = pat.subn(lambda m: m.group(1) + "\n        timeString = org.telegram.messenger.SpyMode.decorateTime(currentMessageObject, timeString);", s, count=1)
          if n[1]:
              open(cell, "w", encoding="utf-8").write(n[0])
              print("ChatMessageCell: пометка удалённых добавлена")
          else:
              warn("ChatMessageCell: не нашёл строку timeString = timeString(...) — пометка «удалено» не добавлена")

          # --- «История правок» в меню сообщения
          chat = ui + "/ChatActivity.java"
          s = open(chat, encoding="utf-8").read()
          ok = True
          a = "public final static int OPTION_COPY = 3;"
          if a not in s:
              ok = False
          else:
              s = s.replace(a, a + "\n    public final static int OPTION_SPY_EDITS = 9001;", 1)

          m = re.search(r'\n([ \t]*)if \(type == -1\) \{\n', s)
          if not m:
              ok = False
          else:
              ind = m.group(1)
              add = ("\n" + ind + "if (org.telegram.messenger.SpyMode.hasEdits(selectedObject)) {"
                     "\n" + ind + "    items.add(\"История правок\");"
                     "\n" + ind + "    options.add(OPTION_SPY_EDITS);"
                     "\n" + ind + "    icons.add(R.drawable.msg_edit);"
                     "\n" + ind + "}\n")
              s = s[:m.start()] + add + s[m.start():]

          m = re.search(r'\n([ \t]*)case OPTION_COPY: \{', s)
          if not m:
              ok = False
          else:
              ind = m.group(1)
              case = ("\n" + ind + "case OPTION_SPY_EDITS: {"
                      "\n" + ind + "    showDialog(org.telegram.messenger.SpyMode.editsDialog(getParentActivity(), selectedObject));"
                      "\n" + ind + "    break;"
                      "\n" + ind + "}")
              s = s[:m.start()] + case + s[m.start():]

          if ok:
              open(chat, "w", encoding="utf-8").write(s)
              print("ChatActivity: пункт «История правок» добавлен")
          else:
              warn("ChatActivity: не нашёл нужные места — пункт «История правок» не добавлен")
          PY

