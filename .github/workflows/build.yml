                 return orig;
             }
             if (table().get(key) != null || skip().get(key)) {
                 return orig;
             }
             int alpha = orig >>> 24;
             if (alpha == 0) {
                 return orig;
             }
             boolean dark = isDark(c);
             updateSeed(c);
             long ck = ((long) key << 34) | (dark ? 1L << 33 : 0L) | (my ? 1L << 32 : 0L) | (orig & 0xFFFFFFFFL);
