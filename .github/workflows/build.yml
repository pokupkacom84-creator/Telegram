             if (seedStamp != 0 && now - seedStamp < 2000) {
                 return;
             }
             seedStamp = now;
             if (Build.VERSION.SDK_INT < 31) {
                 return;
             }
             try {
                 int p = c.getResources().getColor(android.R.color.system_accent1_500, c.getTheme());
                 int n = c.getResources().getColor(android.R.color.system_neutral1_500, c.getTheme());
