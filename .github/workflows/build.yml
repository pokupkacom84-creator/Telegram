                 if "getExternalStorageDirectory" in m.group(1):
                     warn("%s: legacy-путь sdcard/Telegram оставлен как есть" % os.path.basename(path))
                     return m.group(0)
                 changed += 1
                 return m.group(1) + ", org.telegram.messenger.FluxFolderMigration.APP_FOLDER)"
             n = pat.sub(sub, s)
             if n != s:
                 wr(path, n); ok("%s: корень Telegram -> APP_FOLDER" % os.path.basename(path))
         if changed:
             patch("ApplicationLoader.java",
                   "        // AndroidUtilities must be initialized before FileLog\n",
                   "        FluxFolderMigration.migrateIfNeeded(applicationContext);\n\n"
                   "        // AndroidUtilities must be initialized before FileLog\n",
                   "вызов миграции папки")
         else:
             warn("не найдено ни одного new File(..., \"Telegram\"): имя корня, видимо, в другом виде (ImageLoader.createMediaPaths?) — "
                  "миграция НЕ подключена, чтобы не дублировать данные")
         hits = []
         for path in glob.glob(SRC + "/**/*.java", recursive=True):
             for i, line in enumerate(open(path, encoding="utf-8", errors="ignore"), 1):
                 if re.search(r'"Telegram"', line) and re.search(r'File|Dir|Path|path', line):
                     hits.append("%s:%d: %s" % (os.path.basename(path), i, line.strip()[:140]))
         report.append("Оставшиеся \"Telegram\" рядом с путями (проверить вручную):")
         report.extend("  " + h for h in hits[:30])
     checklist = [
         "",
         "### Чек-лист после установки APK",
         "- [ ] В Android/data/com.fluxgram.app/files/ есть FluxGram/, данные на месте",
         "- [ ] Стикеры, аватары и скачанные медиа не пропали",
