     package org.telegram.messenger;
     import android.content.Context;
     import android.content.SharedPreferences;
     import org.telegram.tgnet.TLRPC;
     import java.util.ArrayList;
     import java.util.Random;
     import java.util.concurrent.ConcurrentHashMap;
     public class AutoReply {
         public static final String KEY_ENABLED = "ar_enabled";
         public static final String KEY_TEXT = "ar_text";
         public static final String KEY_CONTACTS = "ar_contacts_only";
         public static final String KEY_ONLINE = "ar_when_online";
         public static final String KEY_COOLDOWN = "ar_cooldown";
         public static final String DEFAULT_TEXT = "Сейчас я не в сети. Отвечу, как только смогу.";
         public static final int[] COOLDOWN_HOURS = {1, 6, 24, 168};
         public static final String[] COOLDOWN_TITLES = {"1 час", "6 часов", "1 день", "1 неделя"};
         private static final ConcurrentHashMap<String, Long> SUPPRESS = new ConcurrentHashMap<>();
         private static final Random RND = new Random();
         private static SharedPreferences prefs() {
             Context c = ApplicationLoader.applicationContext;
             return c == null ? null : c.getSharedPreferences("flux_autoreply", Context.MODE_PRIVATE);
         }
         public static boolean get(String key) {
             SharedPreferences p = prefs();
             return p != null && p.getBoolean(key, false);
         }
         public static void set(String key, boolean value) {
             SharedPreferences p = prefs();
             if (p != null) {
                 p.edit().putBoolean(key, value).apply();
             }
         }
         public static String text() {
             SharedPreferences p = prefs();
             return p == null ? DEFAULT_TEXT : p.getString(KEY_TEXT, DEFAULT_TEXT);
         }
         public static void setText(String value) {
             SharedPreferences p = prefs();
             if (p != null) {
                 p.edit().putString(KEY_TEXT, value == null ? "" : value).apply();
             }
         }
         public static int cooldown() {
             SharedPreferences p = prefs();
             int i = p == null ? 1 : p.getInt(KEY_COOLDOWN, 1);
             return Math.max(0, Math.min(COOLDOWN_HOURS.length - 1, i));
         }
         public static void setCooldown(int index) {
             SharedPreferences p = prefs();
             if (p != null) {
                 p.edit().putInt(KEY_COOLDOWN, index).apply();
             }
         }
         public static boolean suppressed(String peerKey) {
             if (peerKey == null) return false;
             Long until = SUPPRESS.get(peerKey);
             if (until == null) return false;
             if (System.currentTimeMillis() > until) {
                 SUPPRESS.remove(peerKey);
                 return false;
             }
             return true;
         }
         private static boolean isForeground() {
             return !ApplicationLoader.mainInterfacePaused;
         }
         public static void filterUpdates(int acc, java.util.List<TLRPC.Update> updates) {
             if (updates == null || !get(KEY_ENABLED)) return;
             try {
                 for (int i = 0; i < updates.size(); i++) {
                     TLRPC.Update u = updates.get(i);
                     if (u != null && "TL_updateNewMessage".equals(u.getClass().getSimpleName())) {
                         Object mo = u.getClass().getField("message").get(u);
                         if (!(mo instanceof TLRPC.Message)) continue;
                         TLRPC.Message m = (TLRPC.Message) mo;
                         if (m.out || m instanceof TLRPC.TL_messageService || m.action != null) continue;
                         long did = MessageObject.getDialogId(m);
                         if (did > 0) {
                             consider(acc, did, m.message, m.date);
                         }
                     }
                 }
             } catch (Throwable ignore) { }
         }
         public static void onMessages(int acc, ArrayList<MessageObject> messages) {
             if (messages == null || !get(KEY_ENABLED)) return;
             try {
                 for (int i = 0; i < messages.size(); i++) {
                     MessageObject mo = messages.get(i);
                     if (mo == null || mo.messageOwner == null) continue;
                     TLRPC.Message m = mo.messageOwner;
                     if (m.out || m instanceof TLRPC.TL_messageService || m.action != null) continue;
                     long did = mo.getDialogId();
                     if (did > 0) {
                         consider(acc, did, m.message, m.date);
                     }
                 }
             } catch (Throwable ignore) { }
         }
         public static void onUpdates(int acc, TLRPC.Updates updates) {
             if (updates == null || !get(KEY_ENABLED)) return;
             try {
                 if (updates instanceof TLRPC.TL_updateShortMessage) {
                     TLRPC.TL_updateShortMessage s = (TLRPC.TL_updateShortMessage) updates;
                     if (!s.out) {
                         long uid = s.user_id;
                         consider(acc, uid, s.message, s.date);
                     }
                 }
             } catch (Throwable ignore) { }
         }
         private static void consider(final int acc, final long uid, String incoming, int date) {
             try {
                 long now = org.telegram.tgnet.ConnectionsManager.getInstance(acc).getCurrentTime();
                 if (Math.abs(now - date) > 600) return;
                 if (uid == 777000L || uid == UserConfig.getInstance(acc).getClientUserId()) return;
                 if (!get(KEY_ONLINE) && isForeground()) return;
                 final String reply = text();
                 if (reply == null || reply.trim().isEmpty()) return;
                 if (incoming != null && incoming.equals(reply)) return;
                 TLRPC.User user = MessagesController.getInstance(acc).getUser(uid);
                 if (user != null && (user.bot || user.deleted || user.self)) return;
                 if (get(KEY_CONTACTS) && (user == null || !(user.contact || user.mutual_contact))) return;
                 SharedPreferences p = prefs();
                 if (p == null) return;
                 String k = "last_" + acc + "_" + uid;
                 long last = p.getLong(k, 0);
                 if (now - last < COOLDOWN_HOURS[cooldown()] * 3600L) return;
                 p.edit().putLong(k, now).apply();
                 SUPPRESS.put("u" + uid, System.currentTimeMillis() + 30000L);
                 AndroidUtilities.runOnUIThread(new Runnable() {
                     @Override
                     public void run() {
                         try {
                             send(acc, uid, reply);
                         } catch (Throwable ignore) { }
                     }
                 }, 1500 + RND.nextInt(2500));
             } catch (Throwable ignore) { }
         }
         private static void send(int acc, long dialogId, String text) {
             /*@SEND@*/
         }
     }
