         static class LimitView extends View {
             interface Callback {
                 void onSelect(int index);
             }

             private final String[] labels;
             private final Callback callback;
             private int sel;
             private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final RectF rect = new RectF();

             LimitView(Context context, String[] labels, int selected, Callback callback) {
                 super(context);
                 this.labels = labels;
                 this.sel = Math.max(0, Math.min(labels.length - 1, selected));
                 this.callback = callback;
             }

             @Override
             protected void onMeasure(int w, int h) {
                 setMeasuredDimension(MeasureSpec.getSize(w), AndroidUtilities.dp(78));
             }

             private float stopX(int i) {
                 float left = AndroidUtilities.dp(28);
                 float right = getMeasuredWidth() - AndroidUtilities.dp(28);
                 return left + (right - left) * i / (labels.length - 1);
             }

             @Override
             protected void onDraw(Canvas canvas) {
                 float left = AndroidUtilities.dp(28);
                 float right = getMeasuredWidth() - AndroidUtilities.dp(28);
                 float ty = AndroidUtilities.dp(54);
                 float half = AndroidUtilities.dp(5);
                 int accent = Theme.getColor(Theme.key_windowBackgroundWhiteBlueHeader);
                 int text = Theme.getColor(Theme.key_windowBackgroundWhiteBlackText);
                 float sx = stopX(sel);

                 paint.setStyle(Paint.Style.FILL);
                 paint.setColor(accent);
                 paint.setAlpha(70);
                 rect.set(left - half, ty - half, right + half, ty + half);
                 canvas.drawRoundRect(rect, half, half, paint);

                 paint.setColor(accent);
                 rect.set(left - half, ty - half, sx, ty + half);
                 canvas.drawRoundRect(rect, half, half, paint);

                 paint.setColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                 for (int i = 0; i < labels.length; i++) {
                     canvas.drawCircle(stopX(i), ty, AndroidUtilities.dp(2), paint);
                 }

                 textPaint.setTextSize(AndroidUtilities.dp(15));
                 textPaint.setColor(text);
                 textPaint.setTextAlign(Paint.Align.CENTER);
                 for (int i = 0; i < labels.length; i++) {
                     canvas.drawText(labels[i], stopX(i), AndroidUtilities.dp(26), textPaint);
                 }

                 paint.setColor(text);
                 rect.set(sx - AndroidUtilities.dp(1.5f), ty - AndroidUtilities.dp(14), sx + AndroidUtilities.dp(1.5f), ty + AndroidUtilities.dp(14));
                 canvas.drawRoundRect(rect, AndroidUtilities.dp(1.5f), AndroidUtilities.dp(1.5f), paint);
             }

             @Override
             public boolean onTouchEvent(MotionEvent e) {
                 switch (e.getAction()) {
                     case MotionEvent.ACTION_DOWN:
                     case MotionEvent.ACTION_MOVE: {
                         if (getParent() != null) {
                             getParent().requestDisallowInterceptTouchEvent(true);
                         }
                         int best = 0;
                         float bd = Float.MAX_VALUE;
                         for (int i = 0; i < labels.length; i++) {
                             float d = Math.abs(stopX(i) - e.getX());
                             if (d < bd) {
                                 bd = d;
                                 best = i;
                             }
                         }
                         if (best != sel) {
                             sel = best;
                             invalidate();
                         }
                         break;
                     }
                     case MotionEvent.ACTION_UP:
                     case MotionEvent.ACTION_CANCEL:
                         callback.onSelect(sel);
                         break;
                 }
                 return true;
             }
         }
     }
