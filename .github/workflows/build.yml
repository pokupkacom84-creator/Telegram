     public final class FluxFolderMigration {
         public static final String APP_FOLDER = "FluxGram";
         public static final String OLD_FOLDER = "Telegram";
         private static final String PREF = "fluxgram_migration";
         private static final String KEY_MIGRATED = "flux_folder_migrated_v1";
         private static final String KEY_CLEANUP = "flux_folder_cleanup_old";

         public static void migrateIfNeeded(final Context ctx) {
             if (ctx == null) {
                 return;
             }
             final SharedPreferences p = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
             if (p.getBoolean(KEY_MIGRATED, false)) {
                 return;
             }
             Utilities.globalQueue.postRunnable(() -> {
                 try {
                     File[] bases = { ctx.getExternalFilesDir(null), ctx.getFilesDir(),
                                      ctx.getExternalCacheDir(), ctx.getCacheDir() };
                     boolean allOk = true;
                     for (File base : bases) {
                         if (base == null) continue;
                         File oldDir = new File(base, OLD_FOLDER);
                         if (!oldDir.isDirectory()) continue;
                         try {
                             copyDir(oldDir, new File(base, APP_FOLDER));
                             if (p.getBoolean(KEY_CLEANUP, false)) {
                                 deleteDir(oldDir);
                             }
                         } catch (Throwable e) {
                             allOk = false;
                             FileLog.e(e);
                         }
                     }
                     if (allOk) {
                         p.edit().putBoolean(KEY_MIGRATED, true).apply();
                     }
                 } catch (Throwable e) {
                     FileLog.e(e);
                 }
             });
         }

         private static void copyDir(File src, File dst) throws Exception {
             if (src.isDirectory()) {
                 if (!dst.exists() && !dst.mkdirs()) throw new Exception("mkdirs " + dst);
                 File[] children = src.listFiles();
                 if (children == null) return;
                 for (File c : children) copyDir(c, new File(dst, c.getName()));
             } else {
                 if (dst.exists() && dst.length() == src.length()) return;
                 try (InputStream in = new FileInputStream(src);
                      OutputStream out = new FileOutputStream(dst)) {
                     byte[] buf = new byte[65536];
                     int n;
                     while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                 }
             }
         }

         private static void deleteDir(File f) {
             File[] children = f.listFiles();
             if (children != null) for (File c : children) deleteDir(c);
             f.delete();
         }
     }
