              public void onActivityResultFragment(int requestCode, int resultCode, Intent data) {
                  if (resultCode != Activity.RESULT_OK || data == null || data.getData() == null) {
                      return;
                  }
                  try {
                      if (requestCode == REQ_EXPORT) {
                          OutputStream os = getParentActivity().getContentResolver().openOutputStream(data.getData());
                          SpyMode.exportTo(os);
                          toast("База данных экспортирована");
                      } else if (requestCode == REQ_IMPORT) {
                          InputStream in = getParentActivity().getContentResolver().openInputStream(data.getData());
                          SpyMode.importFrom(in);
                          toast("База данных импортирована");
                      }
                  } catch (Exception e) {
                      toast("Ошибка: " + e.getMessage());
                  }
              }

              private void toast(String s) {
                  if (getParentActivity() != null) {
                      Toast.makeText(getParentActivity(), s, Toast.LENGTH_SHORT).show();
                  }
              }

              private void updateNote() {
                  if (usedNote == null) return;
                  String used = AndroidUtilities.formatFileSize(SpyMode.usedBytes());
                  boolean unlimited = SpyMode.getLimit() >= SpyMode.LIMIT_TITLES.length - 1;
                  usedNote.setText("Занято " + used + ". " + (unlimited ? "Вложения не удаляются автоматически." : "Старые вложения удаляются при превышении лимита."));
              }

