                  AlertDialog.Builder b = new AlertDialog.Builder(context);
                  b.setTitle("Управление исключениями");
                  b.setMessage("Для этих чатов удалённые сообщения и правки не сохраняются: " + (ids.isEmpty() ? "список пуст" : android.text.TextUtils.join(", ", ids)) + ". Введите ID чата, чтобы добавить его или убрать из списка.");
                  b.setView(input);
