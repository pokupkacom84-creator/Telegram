                 return;
             }
             sendProfile(account, uid, first, cleanAbout);
         }
         private static void sendProfile(final int account, final long uid, final String first, final String about) {
             try {
                 Class<?> cls;
                 try {
                     cls = Class.forName("org.telegram.tgnet.tl.TL_account$updateProfile");
                 } catch (ClassNotFoundException e) {
                     cls = Class.forName("org.telegram.tgnet.TLRPC$TL_account_updateProfile");
                 }
                 TLObject req = (TLObject) cls.getDeclaredConstructor().newInstance();
                 int add = 0;
                 if (first != null) {
                     cls.getField("first_name").set(req, first);
                     add |= 1;
                 }
                 if (about != null) {
                     cls.getField("about").set(req, about);
                     add |= 4;
                 }
                 Field fFlags = cls.getField("flags");
                 fFlags.setInt(req, fFlags.getInt(req) | add);
                 ConnectionsManager.getInstance(account).sendRequest(req, new RequestDelegate() {
                     @Override
                     public void run(final TLObject response, final TLRPC.TL_error error) {
                         if (error != null) {
                             FileLog.e("FluxBadge: метка не записана: " + error.text);
                             return;
                         }
                         AndroidUtilities.runOnUIThread(new Runnable() {
                             @Override
                             public void run() {
                                 try {
                                     MessagesController mc = MessagesController.getInstance(account);
                                     if (response instanceof TLRPC.User) {
                                         mc.putUser((TLRPC.User) response, false);
                                     }
                                     if (about != null) {
                                         TLRPC.UserFull f = mc.getUserFull(uid);
                                         if (f != null) {
                                             f.about = about;
                                         }
                                     }
                                     scheduleRefresh();
                                 } catch (Throwable e) {
                                     FileLog.e(e);
                                 }
                             }
                         });
                     }
                 });
             } catch (Throwable e) {
                 FileLog.e(e);
             }
         }
         @Override
         public void didReceivedNotification(int id, int account, Object... args) {
             if (id == NotificationCenter.userInfoDidLoad) {
                 if (args == null || args.length < 2 || !(args[0] instanceof Long) || !(args[1] instanceof TLRPC.UserFull)) {
                     return;
                 }
                 long uid = (Long) args[0];
                 String about = ((TLRPC.UserFull) args[1]).about;
                 if (uid == UserConfig.getInstance(account).getClientUserId()) {
                     apply(account, about);
                 } else {
                     learn(uid, isFluxUser(about));
                 }
             } else if (id == NotificationCenter.contactsDidLoad || id == NotificationCenter.dialogsNeedReload) {
                 scheduleScan(account);
             }
         }
