         public static float burstFactor() {
             long e = SystemClock.uptimeMillis() - badgeAt;
             if (badgeAt == 0 || e < 0 || e > 900) {
                 return 0f;
             }
             float t = e / 900f;
             return (float) Math.sin(Math.PI * Math.pow(t, 0.6));
         }

         static final class BurstView extends View {
             private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final Path star = new Path();
             private final float[] ang = new float[16];
             private final float[] dist = new float[16];
             private final float[] size = new float[16];
             float t;

             BurstView(Context c) {
                 super(c);
                 java.util.Random r = new java.util.Random();
                 for (int i = 0; i < ang.length; i++) {
                     ang[i] = (float) (r.nextFloat() * Math.PI * 2);
                     dist[i] = AndroidUtilities.dp(26 + r.nextInt(40));
                     size[i] = AndroidUtilities.dpf2(1.6f + r.nextFloat() * 2.2f);
                 }
             }

             @Override
             protected void onDraw(Canvas canvas) {
                 float cx = getWidth() / 2f;
                 float cy = getHeight() / 2f;
                 float e = 1f - (1f - t) * (1f - t);
                 for (int i = 0; i < ang.length; i++) {
                     float px = cx + (float) Math.cos(ang[i]) * dist[i] * e;
                     float py = cy + (float) Math.sin(ang[i]) * dist[i] * e;
                     p.setColor(BURST_COLORS[i % BURST_COLORS.length]);
                     p.setAlpha((int) (255 * (1f - t)));
                     float r = size[i] * (1f - 0.5f * t);
                     if (i % 3 == 0) {
                         star.reset();
                         float s = r * 2.2f;
                         star.moveTo(px, py - s);
                         star.quadTo(px, py, px + s, py);
                         star.quadTo(px, py, px, py + s);
                         star.quadTo(px, py, px - s, py);
                         star.quadTo(px, py, px, py - s);
                         star.close();
                         canvas.drawPath(star, p);
                     } else {
                         canvas.drawCircle(px, py, r, p);
                     }
                 }
             }
         }

         public static void burstOnce(View anchor) {
             long now = SystemClock.uptimeMillis();
             if (now - lastBurst < 350) {
                 return;
             }
             lastBurst = now;
             burst(anchor);
         }

         public static void burst(View anchor) {
             try {
                 if (anchor == null || !bool(K_BURST, true)) {
                     return;
                 }
                 Context c = anchor.getContext();
                 Activity act = null;
                 while (c instanceof ContextWrapper) {
                     if (c instanceof Activity) {
                         act = (Activity) c;
                         break;
                     }
                     c = ((ContextWrapper) c).getBaseContext();
                 }
                 if (act == null) {
                     return;
                 }
                 int[] loc = new int[2];
                 anchor.getLocationInWindow(loc);
                 float x = loc[0] + anchor.getWidth() - AndroidUtilities.dp(28);
                 float y = loc[1] + anchor.getHeight() - AndroidUtilities.dp(26);
                 final ViewGroup decor = (ViewGroup) act.getWindow().getDecorView();
                 final int size = AndroidUtilities.dp(180);
                 final BurstView bv = new BurstView(act);
                 FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(size, size);
                 lp.leftMargin = (int) (x - size / 2f);
                 lp.topMargin = (int) (y - size / 2f);
                 decor.addView(bv, lp);
                 ValueAnimator a = ValueAnimator.ofFloat(0f, 1f);
                 a.setDuration(650);
                 a.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                     @Override
                     public void onAnimationUpdate(ValueAnimator an) {
                         bv.t = (Float) an.getAnimatedValue();
                         bv.invalidate();
                     }
                 });
                 a.addListener(new AnimatorListenerAdapter() {
                     @Override
                     public void onAnimationEnd(Animator animation) {
                         try {
                             decor.removeView(bv);
                         } catch (Throwable ignore) {
                         }
                     }
                 });
                 a.start();
             } catch (Throwable ignore) {
             }
         }

         public static void decorate(RecyclerView rv) {
             try {
                 if (rv == null || DECORATED.containsKey(rv)) {
                     return;
                 }
                 DECORATED.put(rv, true);
                 rv.addItemDecoration(new RecyclerView.ItemDecoration() {
                     @Override
                     public void getItemOffsets(Rect outRect, View view, RecyclerView parent, RecyclerView.State state) {
                         int g = num(K_GAP, 0);
                         if (g > 0) {
