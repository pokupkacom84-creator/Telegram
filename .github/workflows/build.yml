             } catch (Throwable t) {
                 FileLog.e(t);
             }
             try {
                 ArrayList<TLRPC.TL_contact> contacts = new ArrayList<>(ContactsController.getInstance(account).contacts);
                 for (TLRPC.TL_contact c : contacts) {
                     if (c != null) {
                         enqueue(account, c.user_id, false);
