                         }
                     }
                 });
             } catch (Throwable ignore) {
             }
         }

         public static void applyRadius() {
             try {
                 Field f = SharedConfig.class.getDeclaredField("bubbleRadius");
                 f.setAccessible(true);
                 if (origRadius < 0) {
                     origRadius = f.getInt(null);
                 }
                 int r = num(K_RADIUS, 0);
                 f.setInt(null, r > 0 ? r : origRadius);
             } catch (Throwable ignore) {
             }
         }

         private static float radial(int shape, int lobes, int depth, double th) {
             double d = depth / 100.0;
             int k = Math.max(3, lobes);
             switch (shape) {
                 case 1: {
                     double n = 2.0 + d * 6.0;
                     double c = Math.abs(Math.cos(th));
                     double s = Math.abs(Math.sin(th));
                     return (float) Math.pow(Math.pow(c, n) + Math.pow(s, n), -1.0 / n);
                 }
                 case 2: {
                     double seg = 2 * Math.PI / k;
                     double a = ((th % seg) + seg) % seg - seg / 2;
                     double rp = Math.cos(Math.PI / k) / Math.cos(a);
                     return (float) (rp + (1.0 - rp) * d);
                 }
                 case 3:
                     return (float) (1.0 + (0.03 + 0.14 * d) * Math.cos(k * th));
                 case 4:
                     return (float) (1.0 - 0.55 * d * (1.0 - Math.abs(Math.cos(k * th / 2.0))));
                 case 5:
                     return (float) (1.0 - 0.6 * d * Math.pow(0.5 - 0.5 * Math.cos(k * th), 0.6));
                 default:
                     return 1f;
             }
         }

         private static Path build(int shape, int lobes, int depth, int rot) {
             int n = 240;
             float[] r = new float[n];
             float max = 0.0001f;
             double rr = Math.toRadians(rot);
             for (int i = 0; i < n; i++) {
                 double th = 2 * Math.PI * i / n;
                 r[i] = Math.max(0.05f, radial(shape, lobes, depth, th - rr));
                 if (r[i] > max) {
                     max = r[i];
                 }
             }
             Path p = new Path();
             for (int i = 0; i < n; i++) {
                 double th = 2 * Math.PI * i / n;
                 float x = (float) Math.cos(th) * r[i] / max;
                 float y = (float) Math.sin(th) * r[i] / max;
                 if (i == 0) {
                     p.moveTo(x, y);
                 } else {
                     p.lineTo(x, y);
                 }
             }
             p.close();
             return p;
         }

         public static Path shapePath() {
             int shape = num(K_SHAPE, 0);
             int lobes = num(K_LOBES, 8);
             int depth = num(K_DEPTH, 50);
             int rot = num(K_ROT, 0);
             String key = shape + "|" + lobes + "|" + depth + "|" + rot;
             if (unit == null || !key.equals(unitKey)) {
                 unit = build(shape, lobes, depth, rot);
                 unitKey = key;
             }
             return unit;
         }

         public static boolean avatarBegin(Canvas c, float x, float y, float w, float h, int round) {
             try {
                 if (num(K_SHAPE, 0) == 0 || round <= 0) {
                     return false;
                 }
                 if (Math.abs(w - h) > 2f || w < AndroidUtilities.dp(16) || w > AndroidUtilities.dp(140)) {
                     return false;
                 }
                 if (round * 2 < w - 2f) {
                     return false;
                 }
                 Path p = shapePath();
                 float r = w * 0.5f;
                 float cx = x + r;
                 float cy = y + r;
                 c.save();
                 c.translate(cx, cy);
                 c.scale(r, r);
                 c.clipPath(p);
                 c.scale(1f / r, 1f / r);
                 c.translate(-cx, -cy);
                 return true;
             } catch (Throwable t) {
                 return false;
             }
         }

         private static boolean accepts(Class<?> c, Object key) {
             return (c == int.class && key instanceof Integer) || (!c.isPrimitive() && c.isInstance(key));
         }

         private static Integer themeGet(Object key) {
             for (Method m : Theme.class.getMethods()) {
                 if (!m.getName().equals("getColor") || !Modifier.isStatic(m.getModifiers())) {
                     continue;
                 }
                 Class<?>[] pt = m.getParameterTypes();
                 if (pt.length == 1 && accepts(pt[0], key)) {
                     try {
                         return (Integer) m.invoke(null, key);
                     } catch (Throwable ignore) {
                     }
                 }
             }
             return null;
         }

         private static boolean themeSet(Object key, int color) {
             for (Method m : Theme.class.getMethods()) {
                 if (!m.getName().equals("setColor") || !Modifier.isStatic(m.getModifiers())) {
                     continue;
                 }
                 Class<?>[] pt = m.getParameterTypes();
                 if (pt.length == 3 && pt[1] == int.class && pt[2] == boolean.class && accepts(pt[0], key)) {
                     try {
                         m.invoke(null, key, color, false);
                         return true;
                     } catch (Throwable ignore) {
                     }
                 }
             }
             return false;
         }

         private static int avatarColor(int acc, long did) {
             try {
                 TLRPC.FileLocation loc = null;
                 if (did > 0) {
                     TLRPC.User u = MessagesController.getInstance(acc).getUser(did);
                     if (u != null && u.photo != null) {
                         loc = u.photo.photo_small;
                     }
                 } else if (did < 0) {
                     TLRPC.Chat ch = MessagesController.getInstance(acc).getChat(-did);
                     if (ch != null && ch.photo != null) {
                         loc = ch.photo.photo_small;
                     }
                 }
                 if (loc == null) {
                     return 0;
                 }
                 File f = FileLoader.getInstance(acc).getPathToAttach(loc, true);
                 if (f == null || !f.exists()) {
                     return 0;
                 }
                 BitmapFactory.Options o = new BitmapFactory.Options();
                 o.inSampleSize = 4;
                 Bitmap bm = BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                 if (bm == null) {
                     return 0;
                 }
                 double rs = 0, gs = 0, bs = 0, ws = 0;
                 float[] hsv = new float[3];
                 int step = Math.max(1, Math.min(bm.getWidth(), bm.getHeight()) / 24);
                 for (int y = 0; y < bm.getHeight(); y += step) {
                     for (int x = 0; x < bm.getWidth(); x += step) {
                         int px = bm.getPixel(x, y);
                         Color.colorToHSV(px, hsv);
                         double w = 0.05 + hsv[1] * hsv[2];
                         rs += Color.red(px) * w;
                         gs += Color.green(px) * w;
                         bs += Color.blue(px) * w;
                         ws += w;
                     }
                 }
                 bm.recycle();
                 if (ws <= 0) {
                     return 0;
                 }
                 int dom = Color.rgb((int) (rs / ws), (int) (gs / ws), (int) (bs / ws));
                 Color.colorToHSV(dom, hsv);
                 boolean dark = Theme.isCurrentThemeDark();
                 hsv[1] = Math.min(0.5f, Math.max(0.15f, hsv[1] * 0.7f));
                 hsv[2] = dark ? 0.30f : 0.94f;
                 return Color.HSVToColor(hsv);
             } catch (Throwable t) {
                 return 0;
             }
         }

         private static void restoreColors() {
             if (!dynApplied) {
                 return;
             }
             dynApplied = false;
             try {
                 for (String f : BUBBLE_KEYS) {
                     Integer orig = SAVED.get(f);
                     if (orig != null) {
                         themeSet(Theme.class.getField(f).get(null), orig);
                     }
                 }
             } catch (Throwable ignore) {
             }
             refreshUi();
         }

         public static void onChatResume(int acc, long did) {
             try {
                 if (!bool(K_DYN, false)) {
                     restoreColors();
                     return;
                 }
                 int col = avatarColor(acc, did);
                 if (col == 0) {
                     restoreColors();
                     return;
                 }
                 boolean any = false;
                 for (String f : BUBBLE_KEYS) {
                     Object key = Theme.class.getField(f).get(null);
                     if (!SAVED.containsKey(f)) {
                         Integer orig = themeGet(key);
                         if (orig != null) {
                             SAVED.put(f, orig);
                         }
                     }
                     any |= themeSet(key, col);
                 }
                 if (any) {
                     dynApplied = true;
                     refreshUi();
                 }
             } catch (Throwable ignore) {
             }
         }

         public static void onChatPause() {
             try {
                 restoreColors();
             } catch (Throwable ignore) {
             }
         }
     }'''
