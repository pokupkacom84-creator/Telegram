name: Build APK (Telegram fork)
on:
 workflow_dispatch:
  inputs:
   abi:
    description: "Какие архитектуры собирать (arm64-v8a — быстрее всего)"
    type: choice
    default: all
    options:
    - all
    - arm64-v8a
    - armeabi-v7a
    - x86_64
   rebrand:
    description: "Сменить имя пакета и название приложения"
    type: boolean
    default: true
   ghost_read:
    description: "Призрак: не отправлять «прочитано» (чаты, голосовые)"
    type: boolean
    default: true
   ghost_typing:
    description: "Призрак: не показывать «печатает…»"
    type: boolean
    default: true
   ghost_online:
    description: "Призрак: не показывать «в сети»"
    type: boolean
    default: true
   ghost_stories:
    description: "Призрак: не отмечать истории просмотренными"
    type: boolean
    default: true
   ghost_offline:
    description: "Призрак: автоматический «офлайн» после отправки сообщения"
    type: boolean
    default: false
   material_you:
    description: "FluxGram: тема Material You 3 включена по умолчанию (Android 12+)"
    type: boolean
    default: true
   badge_particles:
    description: "FluxGram: частицы вокруг значка по умолчанию (в приложении выключаются в «Темы FluxGram»)"
    type: boolean
    default: true
   badge_style:
    description: "FluxGram: стиль значка по умолчанию (в приложении меняется в «Темы FluxGram»)"
    type: choice
    default: classic
    options:
    - classic
    - md3_flower
    - md3_square
   keep_view_once:
    description: "FluxGram: view-once медиа не удаляются после просмотра"
    type: boolean
    default: true
   folder_rename:
    description: "FluxGram: корневая папка Telegram/ -> FluxGram/ с миграцией данных"
    type: boolean
    default: true
   hide_ads:
    description: "FluxGram: скрыть рекламу и спонсорские сообщения"
    type: boolean
    default: true
   hide_channel_stories:
    description: "FluxGram: скрыть истории каналов"
    type: boolean
    default: true
   hide_own_phone:
    description: "FluxGram: скрыть свой номер телефона (меню, настройки, профиль)"
    type: boolean
    default: true
   profile_details:
    description: "FluxGram: в профиле показывать ID, DC и дату регистрации"
    type: boolean
    default: true
   message_seconds:
    description: "FluxGram: время у сообщений с секундами"
    type: boolean
    default: true
   auto_proxy:
    description: "FluxGram: автопрокси MTProto из GitHub (включать сразу и обновлять)"
    type: boolean
    default: true
   strict_features:
    description: "Остановить сборку, если хук доп. функций (view-once, запрет копирования, Premium, ускорение, профиль) не применился"
    type: boolean
    default: true
   no_premium_lock:
    description: "FluxGram: снять визуальные замки Premium в EmojiView / ReactionsLayoutInBubble (isPremiumLocked, showPremiumFeatureLocked)"
    type: boolean
    default: true
   always_translate:
    description: "FluxGram: принудительно показывать кнопку перевода для всех сообщений (патч MessageObject.isTranslatable / TranslateAlert)"
    type: boolean
    default: true
   always_copy_formatted:
    description: "FluxGram: копировать текст всегда с markdown-форматированием (bold, italic, code, links)"
    type: boolean
    default: true
   auto_reply_delayed:
    description: "FluxGram: автоответчик — отправка ответа через 5 минут каждому написавшему (список исключений в настройках)"
    type: boolean
    default: false
   unlimited_pins:
    description: "FluxGram: снять лимит закреплённых чатов (патч LocalFolderPinsController / PinController)"
    type: boolean
    default: true
   unlimited_folders:
    description: "FluxGram: снять лимит папок (патч FiltersSetupActivity / FilterListController)"
    type: boolean
    default: true
   profile_color_free:
    description: "FluxGram: выбор цвета профиля без Premium (патч guard в ProfileColorActivity)"
    type: boolean
    default: true
   custom_emoji_free:
    description: "FluxGram: статусные эмодзи без Premium в UI (патч isPremiumLocked в EmojiStatusChooser)"
    type: boolean
    default: true
   channel_stats_always:
    description: "FluxGram: показывать статистику канала всегда (патч guard canViewStats / StatisticActivity)"
    type: boolean
    default: true
   deleted_msg_cache:
    description: "FluxGram: отдельный слой кэша удалённых сообщений (дополняет ShyMode, пишет в FluxDeletedCache)"
    type: boolean
    default: true
   bot_button_copy:
    description: "FluxGram: копировать текст inline-кнопки по долгому тапу (патч BotButtonCell)"
    type: boolean
    default: true
   proxy_sources:
    description: "FluxProxy: дополнительные источники прокси (необязательно, по умолчанию встроенный список)"
    type: string
    default: ""
env:
 APP_NAME: FluxGram
 APP_PACKAGE: com.fluxgram.app
 ABI: ${{ inputs.abi }}
 REBRAND: ${{ inputs.rebrand }}
 GHOST_READ: ${{ inputs.ghost_read }}
 GHOST_TYPING: ${{ inputs.ghost_typing }}
 GHOST_ONLINE: ${{ inputs.ghost_online }}
 GHOST_STORIES: ${{ inputs.ghost_stories }}
 GHOST_OFFLINE: ${{ inputs.ghost_offline }}
 MATERIAL_YOU: ${{ inputs.material_you }}
 BADGE_PARTICLES: ${{ inputs.badge_particles }}
 BADGE_STYLE: ${{ inputs.badge_style }}
 KEEP_VIEW_ONCE: ${{ inputs.keep_view_once }}
 FOLDER_RENAME: ${{ inputs.folder_rename }}
 HIDE_ADS: ${{ inputs.hide_ads }}
 HIDE_CHANNEL_STORIES: ${{ inputs.hide_channel_stories }}
 HIDE_OWN_PHONE: ${{ inputs.hide_own_phone }}
 PROFILE_DETAILS: ${{ inputs.profile_details }}
 MESSAGE_SECONDS: ${{ inputs.message_seconds }}
 AUTO_PROXY: ${{ inputs.auto_proxy }}
 NO_PREMIUM_LOCK: ${{ inputs.no_premium_lock }}
 ALWAYS_TRANSLATE: ${{ inputs.always_translate }}
 ALWAYS_COPY_FORMATTED: ${{ inputs.always_copy_formatted }}
 AUTO_REPLY_DELAYED: ${{ inputs.auto_reply_delayed }}
 UNLIMITED_PINS: ${{ inputs.unlimited_pins }}
 UNLIMITED_FOLDERS: ${{ inputs.unlimited_folders }}
 PROFILE_COLOR_FREE: ${{ inputs.profile_color_free }}
 CUSTOM_EMOJI_FREE: ${{ inputs.custom_emoji_free }}
 CHANNEL_STATS_ALWAYS: ${{ inputs.channel_stats_always }}
 DELETED_MSG_CACHE: ${{ inputs.deleted_msg_cache }}
 BOT_BUTTON_COPY: ${{ inputs.bot_button_copy }}
 PROXY_SOURCES: ${{ inputs.proxy_sources }}
defaults:
 run:
  shell: bash
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 180
  steps:
  - name: Checkout (с сабмодулями)
    uses: actions/checkout@v4
    with:
     submodules: recursive
  - name: Освободить место на диске
    run: |
     sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
     df -h /
  - uses: actions/setup-java@v4
    with:
     distribution: temurin
     java-version: 17
     cache: gradle
  - uses: actions/setup-go@v5
    with:
     go-version: stable
     cache: false
  - name: Системные пакеты
    run: |
     set +e
     for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
       [ -f "$f" ] && sudo cp -n "$f" "$f.orig"
     done
     MIRRORS=(
       "http://archive.ubuntu.com/ubuntu/"
       "http://mirrors.edge.kernel.org/ubuntu/"
       "http://us.archive.ubuntu.com/ubuntu/"
       "http://mirror.yandex.ru/ubuntu/"
       "http://azure.archive.ubuntu.com/ubuntu/"
     )
     ok=0
     for i in 0 1 2 3 4; do
       M="${MIRRORS[$i]}"
       echo ">>> попытка $((i+1)): зеркало $M"
       for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
         [ -f "$f.orig" ] || continue
         sudo cp "$f.orig" "$f"
         sudo sed -i -E "s#mirror\+file:/etc/apt/apt-mirrors.txt#$M#g; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#$M#g; s#https?://security\.ubuntu\.com/ubuntu/?#$M#g" "$f"
       done
       if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
          && sudo apt-get install -y --fix-missing -o Acquire::Retries=3 \
               ninja-build nasm yasm make cmake perl pkg-config; then
         ok=1
         break
       fi
       echo "::warning::apt, попытка $((i+1)) не удалась (зеркало $M)"
       sleep 10
     done
     [ "$ok" = 1 ] || { echo "::error::apt не смог установить пакеты ни с одного зеркала"; exit 1; }
  - name: Android SDK / NDK (версии берём из проекта)
    run: |
     set +e
     G=$(find . -name '*.gradle' -not -path './TMessagesProj/jni/*' -not -path './.git/*')
     NDK_VER=$(grep -hE "ndkVersion" $G gradle.properties 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
     SDK_VER=$(grep -hE "compileSdk(Version)?[ =]+[0-9]+" $G 2>/dev/null | grep -oE '[0-9]+' | head -1)
     BT_VER=$(grep -hoE "buildToolsVersion[ =]+['\"][0-9.]+" $G 2>/dev/null | grep -oE '[0-9.]+$' | head -1)
     NDK_VER=${NDK_VER:-27.2.12479018}
     SDK_VER=${SDK_VER:-36}
     BT_VER=${BT_VER:-36.0.0}
     echo "ndk=$NDK_VER compileSdk=$SDK_VER buildTools=$BT_VER"
     SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
     set +o pipefail
     yes | "$SDKM" --licenses > /dev/null 2>&1
     for pkg in "platforms;android-$SDK_VER" "build-tools;$BT_VER" "ndk;$NDK_VER" "cmake;3.22.1"; do
       echo ">>> sdkmanager $pkg"
       "$SDKM" --install "$pkg" > /dev/null || echo "WARN: не удалось поставить $pkg (gradle попробует сам)"
     done
     if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
       echo "::error::NDK $NDK_VER не установился"
       ls "$ANDROID_HOME/ndk" || true
       exit 1
     fi
     echo "NDK_VER=$NDK_VER" >> "$GITHUB_ENV"
  - name: Ребрендинг (имя пакета, название, google-services.json)
    if: ${{ env.REBRAND != 'false' }}
    run: |
     python3 - <<'PY'
     import re, glob, json, os
     pkg = os.environ["APP_PACKAGE"]
     name = os.environ["APP_NAME"]
     for f in glob.glob("**/build.gradle", recursive=True):
         if f.startswith(".git") or "/jni/" in f or f.startswith("TMessagesProj/jni"):
             continue
         s = open(f, encoding="utf-8").read()
         n = re.sub(r'(?m)^(\s*applicationId\s*=?\s*)(["\'])[^"\']*\2',
                    lambda m: m.group(1) + '"' + pkg + '"', s)
         if n != s:
             open(f, "w", encoding="utf-8").write(n)
             print("applicationId ->", f)
     for f in glob.glob("**/google-services.json", recursive=True):
         if f.startswith(".git"):
             continue
         import copy
         d = json.load(open(f, encoding="utf-8"))
         clients = d.get("client", [])
         extra = copy.deepcopy(clients[0])
         extra["client_info"]["android_client_info"]["package_name"] = pkg
         d["client"] = clients + [extra]
         json.dump(d, open(f, "w", encoding="utf-8"), indent=2)
         print("google-services ->", f, [c["client_info"]["android_client_info"]["package_name"] for c in d["client"]])
     for f in glob.glob("**/agconnect-services.json", recursive=True):
         if f.startswith(".git"):
             continue
         d = json.load(open(f, encoding="utf-8"))
         if isinstance(d.get("client"), dict):
             d["client"]["package_name"] = pkg
             json.dump(d, open(f, "w", encoding="utf-8"), indent=2)
             print("agconnect ->", f, pkg)
     open("rebrand.init.gradle", "w").write('''
     allprojects {
         afterEvaluate { p ->
             if (p.plugins.hasPlugin('com.android.application')) {
                 def pkg = System.getenv('APP_PACKAGE')
                 p.android.defaultConfig.applicationId = pkg
                 p.android.productFlavors.each { f ->
                     if (f.applicationId != null) { f.applicationId = pkg }
                     f.applicationIdSuffix = null
                 }
                 p.android.buildTypes.each { b -> b.applicationIdSuffix = null }
                 println "REBRAND: " + p.path + " applicationId=" + pkg
             }
         }
     }
     '''.replace("\n          ", "\n"))
     p = "TMessagesProj/src/main/res/values/strings.xml"
     s = open(p, encoding="utf-8").read()
     s = re.sub(r'(<string name="AppName(?:Beta)?"[^>]*>)[^<]*', lambda m: m.group(1) + name, s)
     open(p, "w", encoding="utf-8").write(s)
     label_re = re.compile(r'android:label="@string/(?:AppName|AppNameBeta|ApplicationName)"')
     for mf in glob.glob("**/AndroidManifest.xml", recursive=True):
         if mf.startswith(".git") or "/build/" in mf or "/jni/" in mf:
             continue
         t = open(mf, encoding="utf-8").read()
         n = label_re.sub('android:label="' + name + '"', t)
         if n != t:
             open(mf, "w", encoding="utf-8").write(n)
             print("manifest label ->", mf)
     PY
     grep -rn "applicationId" --include=build.gradle . | grep -v jni || true
     grep -n 'name="AppName' TMessagesProj/src/main/res/values/strings.xml || true
  - name: Режим призрака (патч исходников)
    run: |
     python3 - <<'PY'
     import re, os, sys
     def flag(name, default):
         return os.environ.get(name, default) == "true"
     READ = flag("GHOST_READ", "true")
     TYPING = flag("GHOST_TYPING", "true")
     ONLINE = flag("GHOST_ONLINE", "true")
     STORIES = flag("GHOST_STORIES", "true")
     OFFLINE = flag("GHOST_OFFLINE", "false")
     print("ghost defaults: read=%s stories=%s online=%s typing=%s offline=%s" % (READ, STORIES, ONLINE, TYPING, OFFLINE))
     tg = "TMessagesProj/src/main/java/org/telegram/tgnet"
     tlrpc = open(tg + "/TLRPC.java", encoding="utf-8").read()
     import glob
     SRC = {"TLRPC": tlrpc}
     for _f in glob.glob(tg + "/tl/*.java"):
         SRC[os.path.basename(_f)[:-5]] = open(_f, encoding="utf-8").read()
     Q = {}
     def has(name, only=None):
         for holder, text in SRC.items():
             if only and holder != only:
                 continue
             if re.search(r'class\s+' + name + r'\b', text):
                 Q[name] = ("TLRPC." if holder == "TLRPC" else "org.telegram.tgnet.tl." + holder + ".") + name
                 print("  найден    " + Q[name])
                 return True
         print("  НЕ найден " + name)
         return False
     cases = []
     offline_impl = "private static void sendOffline() { }"
     if has("TL_messages_readHistory"):
         cases.append('if (req instanceof TLRPC.TL_messages_readHistory) { if (on(KEY_READ)) { remember(peerKey(((TLRPC.TL_messages_readHistory) req).peer), req); return true; } return false; }')
     if has("TL_channels_readHistory"):
         cases.append('if (req instanceof TLRPC.TL_channels_readHistory) { if (on(KEY_READ)) { TLRPC.InputChannel ch = ((TLRPC.TL_channels_readHistory) req).channel; remember(ch == null ? null : "c" + ch.channel_id, req); return true; } return false; }')
     for n in ("TL_messages_readMessageContents", "TL_channels_readMessageContents"):
         if has(n):
             cases.append('if (req instanceof TLRPC.%s) return on(KEY_READ);' % n)
     for n in ("TL_stories_readStories", "TL_stories_incrementStoryViews"):
         if has(n):
             cases.append('if (req instanceof %s) return on(KEY_STORIES);' % Q[n])
     if has("TL_messages_setTyping"):
         cases.append('if (req instanceof TLRPC.TL_messages_setTyping) return on(KEY_TYPING);')
     if has("updateStatus", "TL_account"):
         ST = Q["updateStatus"]
         cases.append('if (req instanceof %s) { if (on(KEY_ONLINE)) { ((%s) req).offline = true; } return false; }' % (ST, ST))
         offline_impl = """private static void sendOffline() {
             AndroidUtilities.runOnUIThread(new Runnable() {
                 @Override
                 public void run() {
                     org.telegram.tgnet.tl.TL_account.updateStatus r = new org.telegram.tgnet.tl.TL_account.updateStatus();
                     r.offline = true;
                     ConnectionsManager.getInstance(UserConfig.selectedAccount).sendRequest(r, new RequestDelegate() {
                         @Override
                         public void run(TLObject response, TLRPC.TL_error error) { }
                     });
                 }
             }, 1500);
         }"""
     sends = [("TL_messages_sendMessage", "peer", True),
              ("TL_messages_sendMedia", "peer", True),
              ("TL_messages_sendMultiMedia", "peer", True),
              ("TL_messages_forwardMessages", "to_peer", True),
              ("TL_messages_sendReaction", "peer", False)]
     for n, field, silent in sends:
         if has(n):
             body = 'TLRPC.%s r = (TLRPC.%s) req; onAction(peerKey(r.%s));' % (n, n, field)
             if silent:
                 body += ' if (get(KEY_SILENT)) { r.silent = true; }'
             cases.append('if (req instanceof TLRPC.%s) { %s return false; }' % (n, body))
     java = """package org.telegram.messenger;

     import android.content.Context;
     import android.content.SharedPreferences;

     import org.telegram.tgnet.ConnectionsManager;
     import org.telegram.tgnet.RequestDelegate;
     import org.telegram.tgnet.TLObject;
     import org.telegram.tgnet.TLRPC;

     import java.util.concurrent.ConcurrentHashMap;

     public class GhostMode {
         public static final String KEY_GHOST = "ghost_enabled";
         public static final String KEY_READ = "ghost_read";
         public static final String KEY_STORIES = "ghost_stories";
         public static final String KEY_ONLINE = "ghost_online";
         public static final String KEY_TYPING = "ghost_typing";
         public static final String KEY_OFFLINE = "ghost_offline";
         public static final String KEY_ACTION_READ = "ghost_read_on_action";
         public static final String KEY_SILENT = "send_silent";

         private static final ConcurrentHashMap<String, TLObject> PENDING = new ConcurrentHashMap<>();
         private static final ThreadLocal<Boolean> BYPASS = new ThreadLocal<>();

         private static SharedPreferences prefs() {
             Context c = ApplicationLoader.applicationContext;
             return c == null ? null : c.getSharedPreferences("ghostmode", Context.MODE_PRIVATE);
         }

         private static boolean def(String key) {
             if (KEY_GHOST.equals(key)) return true;
             if (KEY_READ.equals(key)) return @READ@;
             if (KEY_STORIES.equals(key)) return @STORIES@;
             if (KEY_ONLINE.equals(key)) return @ONLINE@;
             if (KEY_TYPING.equals(key)) return @TYPING@;
             if (KEY_OFFLINE.equals(key)) return @OFFLINE@;
             return false;
         }

         public static boolean get(String key) {
             SharedPreferences p = prefs();
             return p == null ? def(key) : p.getBoolean(key, def(key));
         }

         public static void set(String key, boolean value) {
             SharedPreferences p = prefs();
             if (p != null) {
                 p.edit().putBoolean(key, value).apply();
             }
         }

         private static boolean on(String key) {
             return get(KEY_GHOST) && get(key);
         }

         private static String peerKey(TLRPC.InputPeer p) {
             if (p == null) return null;
             if (p.channel_id != 0) return "c" + p.channel_id;
             if (p.chat_id != 0) return "g" + p.chat_id;
             return "u" + p.user_id;
         }

         private static void remember(String key, TLObject req) {
             if (key != null) {
                 PENDING.put(key, req);
             }
         }

         private static void onAction(String key) {
             if (key != null && get(KEY_ACTION_READ)) {
                 TLObject pending = PENDING.remove(key);
                 if (pending != null) {
                     BYPASS.set(Boolean.TRUE);
                     try {
                         ConnectionsManager.getInstance(UserConfig.selectedAccount).sendRequest(pending, new RequestDelegate() {
                             @Override
                             public void run(TLObject response, TLRPC.TL_error error) { }
                         });
                     } finally {
                         BYPASS.set(Boolean.FALSE);
                     }
                 }
             }
             if (on(KEY_OFFLINE)) {
                 sendOffline();
             }
         }

         @OFFLINE_IMPL@

         public static boolean drop(TLObject req) {
             if (req == null) return false;
             if (Boolean.TRUE.equals(BYPASS.get())) return false;
             @CHECKS@
             return false;
         }
     }
     """
     java = (java.replace("@READ@", str(READ).lower())
                 .replace("@STORIES@", str(STORIES).lower())
                 .replace("@ONLINE@", str(ONLINE).lower())
                 .replace("@TYPING@", str(TYPING).lower())
                 .replace("@OFFLINE@", str(OFFLINE).lower())
                 .replace("@OFFLINE_IMPL@", offline_impl)
                 .replace("@CHECKS@", "\n        ".join(cases)))
     open("TMessagesProj/src/main/java/org/telegram/messenger/GhostMode.java", "w", encoding="utf-8").write(java)
     cm = tg + "/ConnectionsManager.java"
     src = open(cm, encoding="utf-8").read()
     pat = re.compile(r'(public\s+(?:synchronized\s+)?int\s+sendRequest\w*\s*\(\s*(?:final\s+)?(?:org\.telegram\.tgnet\.)?TLObject\s+(\w+)\s*,[^{;]*?\)\s*(?:throws[^{]*)?\{)', re.S)
     count = [0]
     def rep(m):
         count[0] += 1
         return m.group(1) + "\n        if (org.telegram.messenger.GhostMode.drop(%s)) { return 0; }" % m.group(2)
     new = pat.sub(rep, src)
     print("ConnectionsManager: пропатчено методов:", count[0])
     if count[0] == 0:
         print("::error::Не нашёл sendRequest в ConnectionsManager. Сигнатуры:")
         for l in src.splitlines():
             if "sendRequest" in l and ("public" in l or "private" in l):
                 print("   ", l.strip())
         sys.exit(1)
     open(cm, "w", encoding="utf-8").write(new)
     PY
     echo "--- GhostMode.java ---"
     cat TMessagesProj/src/main/java/org/telegram/messenger/GhostMode.java
     echo "--- хуки ---"
     grep -n "GhostMode" TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
  - name: Переименование Telegram → FluxGram (строки интерфейса)
    if: ${{ env.REBRAND != 'false' }}
    run: |
     python3 - <<'PY'
     import re, glob, os
     NAME = os.environ["APP_NAME"]
     pat = re.compile(r'(?<![A-Za-z0-9_/@.#:=-])Telegram(?![A-Za-z0-9_])')
     def fix(m):
         return m.group(1) + pat.sub(NAME, m.group(2)) + m.group(3)
     files = [f for f in glob.glob("**/res/values*/strings*.xml", recursive=True)
              if not f.startswith(".git") and "/jni/" not in f]
     total = 0
     for f in files:
         s = open(f, encoding="utf-8").read()
         n = re.sub(r'(>)([^<]+)(<)', fix, s)
         if n != s:
             total += len(pat.findall(re.sub(r'<[^>]*>', ' ', s)))
             open(f, "w", encoding="utf-8").write(n)
     print("файлов strings:", len(files), " замен Telegram ->", NAME, ":", total)
