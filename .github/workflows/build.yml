         private class Swatch extends View {
             private final int hue;
             private final int sat;
             private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
             Swatch(Context c, int hue, int sat) {
                 super(c);
                 this.hue = hue;
                 this.sat = sat;
             }
             private int color(Role r) {
                 boolean dark = FluxFeatures.isDark(getContext());
                 if (hue < 0) {
                     return Build.VERSION.SDK_INT >= 31 ? FluxFeatures.systemColor(getContext(), r, dark) : 0xFF888888;
                 }
                 return FluxFeatures.paletteColor(r, dark, hue, sat / 100f);
             }
             @Override
             protected void onDraw(Canvas canvas) {
                 float cx = getWidth() / 2f;
                 float cy = getHeight() / 2f;
                 float r = Math.min(cx, cy) - AndroidUtilities.dp(4);
                 p.setStyle(Paint.Style.FILL);
                 p.setColor(color(Role.PRIMARY_CONTAINER));
                 canvas.drawCircle(cx, cy, r, p);
                 p.setColor(color(Role.PRIMARY));
                 canvas.drawArc(new RectF(cx - r, cy - r, cx + r, cy + r), -90, 180, true, p);
                 p.setColor(color(Role.TERTIARY));
                 canvas.drawCircle(cx, cy, r * 0.35f, p);
                 boolean sel = FluxFeatures.seedHue(getContext()) == hue && (hue < 0 || FluxFeatures.seedSat(getContext()) == sat);
                 if (sel) {
                     p.setStyle(Paint.Style.STROKE);
                     p.setStrokeWidth(AndroidUtilities.dp(3));
                     p.setColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
                     canvas.drawCircle(cx, cy, r + AndroidUtilities.dp(2), p);
                 }
             }
         }
         private class BadgeStylePicker extends View {
             private final FluxBadgeDrawable[] items = new FluxBadgeDrawable[3];
             private final String[] labels = {"Обычный", "MD3 цветок", "MD3 квадрат"};
             private final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final Paint rp = new Paint(Paint.ANTI_ALIAS_FLAG);
             BadgeStylePicker(Context c) {
                 super(c);
                 for (int i = 0; i < 3; i++) {
                     items[i] = new FluxBadgeDrawable(c, false, false).forceStyle(i);
                 }
                 setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                 tp.setTextSize(AndroidUtilities.dp(12));
                 tp.setTextAlign(Paint.Align.CENTER);
                 rp.setStyle(Paint.Style.STROKE);
                 rp.setStrokeWidth(AndroidUtilities.dp(2));
             }
             @Override
             protected void onDraw(Canvas canvas) {
                 int sel = FluxBadgeDrawable.style(getContext());
                 float w = getWidth() / 3f;
                 float cy = getHeight() * 0.42f;
                 for (int i = 0; i < 3; i++) {
                     float cx = w * (i + 0.5f);
                     float scale = 2f;
                     float side = items[i].getIntrinsicWidth() * scale;
                     canvas.save();
                     canvas.translate(cx - side / 2f, cy - side / 2f);
                     canvas.scale(scale, scale);
                     items[i].draw(canvas);
                     canvas.restore();
                     boolean on = i == sel;
                     if (on) {
                         rp.setColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
                         canvas.drawCircle(cx, cy, side * 0.62f, rp);
                     }
                     tp.setColor(Theme.getColor(on ? Theme.key_windowBackgroundWhiteBlackText : Theme.key_windowBackgroundWhiteGrayText4));
                     canvas.drawText(labels[i], cx, cy + side / 2f + AndroidUtilities.dp(18), tp);
                 }
             }
             @Override
             public boolean onTouchEvent(android.view.MotionEvent e) {
                 if (e.getAction() == android.view.MotionEvent.ACTION_UP) {
                     int i = (int) (e.getX() / (getWidth() / 3f));
                     i = Math.max(0, Math.min(2, i));
                     FluxBadgeDrawable.setStyle(getContext(), i);
                     invalidate();
                     if (badgePreview != null) {
                         badgePreview.invalidate();
                     }
                     FluxBadge.refreshNow();
                 }
                 return true;
             }
         }
         private class BadgePreview extends View {
             private final FluxBadgeDrawable userBadge;
             private final FluxBadgeDrawable officialBadge;
             private final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
             BadgePreview(Context c) {
                 super(c);
                 userBadge = new FluxBadgeDrawable(c, true, false);
                 officialBadge = new FluxBadgeDrawable(c, true, true);
                 setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                 tp.setTextSize(AndroidUtilities.dp(12));
                 tp.setTextAlign(Paint.Align.CENTER);
             }
             private void drawBadge(Canvas canvas, FluxBadgeDrawable d, float cx, float cy, String label) {
                 float scale = 2.2f;
                 float side = d.getIntrinsicWidth() * scale;
                 canvas.save();
                 canvas.translate(cx - side / 2f, cy - side / 2f);
                 canvas.scale(scale, scale);
                 d.draw(canvas);
                 canvas.restore();
                 tp.setColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
                 canvas.drawText(label, cx, cy + side / 2f + AndroidUtilities.dp(14), tp);
             }
             @Override
             protected void onDraw(Canvas canvas) {
                 float h = getHeight() * 0.42f;
                 drawBadge(canvas, userBadge, getWidth() * 0.27f, h, "Пользователь FluxGram");
                 drawBadge(canvas, officialBadge, getWidth() * 0.73f, h, "Официальный канал");
                 if (FluxBadgeDrawable.particlesEnabled(getContext())) {
                     postInvalidateOnAnimation();
                 }
             }
         }
         private class PreviewView extends View {
             private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final RectF rf = new RectF();
             PreviewView(Context c) {
                 super(c);
             }
             private int col(Role r, boolean dark) {
                 return FluxFeatures.preview(getContext(), r, dark);
             }
             @Override
             protected void onDraw(Canvas canvas) {
                 int pad = AndroidUtilities.dp(14);
                 int gap = AndroidUtilities.dp(12);
                 int w = (getWidth() - pad * 2 - gap) / 2;
                 int h = getHeight() - AndroidUtilities.dp(16);
                 drawPanel(canvas, pad, AndroidUtilities.dp(8), w, h, false);
                 drawPanel(canvas, pad + w + gap, AndroidUtilities.dp(8), w, h, true);
             }
             private void box(Canvas c, float l, float t, float r, float b, float rad, int color) {
                 p.setStyle(Paint.Style.FILL);
                 p.setColor(color);
                 rf.set(l, t, r, b);
                 c.drawRoundRect(rf, rad, rad, p);
             }
             private void drawPanel(Canvas c, int x, int y, int w, int h, boolean dark) {
                 int d = AndroidUtilities.dp(1);
                 box(c, x, y, x + w, y + h, AndroidUtilities.dp(24), col(Role.SURFACE, dark));
                 box(c, x + d * 10, y + d * 10, x + w - d * 10, y + d * 34, d * 12, col(Role.SURFACE_CONTAINER, dark));
                 box(c, x + d * 18, y + d * 18, x + d * 70, y + d * 26, d * 4, col(Role.ON_SURFACE, dark));
                 box(c, x + d * 10, y + d * 44, x + w * 0.72f, y + d * 78, d * 14, col(Role.SURFACE_CONTAINER_HIGH, dark));
                 box(c, x + d * 20, y + d * 56, x + w * 0.5f, y + d * 62, d * 3, col(Role.ON_SURFACE_VARIANT, dark));
                 box(c, x + w * 0.28f, y + d * 86, x + w - d * 10, y + d * 120, d * 14, col(Role.PRIMARY_CONTAINER, dark));
                 box(c, x + w * 0.4f, y + d * 98, x + w * 0.82f, y + d * 104, d * 3, col(Role.ON_PRIMARY_CONTAINER, dark));
                 box(c, x + d * 10, y + d * 130, x + d * 56, y + d * 148, d * 9, col(Role.SECONDARY_CONTAINER, dark));
                 box(c, x + d * 62, y + d * 130, x + d * 100, y + d * 148, d * 9, col(Role.TERTIARY_CONTAINER, dark));
                 float fb = y + h - d * 12;
                 box(c, x + w - d * 56, fb - d * 44, x + w - d * 12, fb, d * 14, col(Role.PRIMARY_CONTAINER, dark));
                 box(c, x + w - d * 42, fb - d * 30, x + w - d * 26, fb - d * 14, d * 4, col(Role.ON_PRIMARY_CONTAINER, dark));
                 box(c, x + d * 10, fb - d * 36, x + w - d * 68, fb, d * 18, col(Role.SURFACE_VARIANT, dark));
             }
         }
     }
