     import org.telegram.ui.ActionBar.Theme;
     import org.telegram.ui.Cells.HeaderCell;
     import org.telegram.ui.Cells.TextCheckCell;
     import org.telegram.ui.Cells.TextSettingsCell;
     public class AutoReplySettingsActivity extends BaseFragment {
         private TextSettingsCell intervalCell;
         @Override
         public View createView(final Context context) {
             actionBar.setBackButtonImage(R.drawable.ic_ab_back);
             actionBar.setAllowOverlayTitle(true);
             actionBar.setTitle("Автоответчик");
             actionBar.setActionBarMenuOnItemClick(new ActionBar.ActionBarMenuOnItemClick() {
                 @Override
                 public void onItemClick(int id) {
                     if (id == -1) {
                         finishFragment();
                     }
                 }
             });
             FrameLayout root = new FrameLayout(context);
             root.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundGray));
             fragmentView = root;
             ScrollView scroll = new ScrollView(context);
             root.addView(scroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
             LinearLayout list = new LinearLayout(context);
             list.setOrientation(LinearLayout.VERTICAL);
             scroll.addView(list, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
             addHeader(list, context, "Автоответчик");
             addSwitch(list, context, "Включить автоответчик", AutoReply.KEY_ENABLED, false);
             addNote(list, context, "Отвечает на личные сообщения, пока приложение свёрнуто или закрыто (то есть ты офлайн). Боты, группы и каналы пропускаются.");
             addHeader(list, context, "Текст ответа");
             LinearLayout box = new LinearLayout(context);
             box.setOrientation(LinearLayout.VERTICAL);
             box.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             EditText edit = new EditText(context);
             edit.setText(AutoReply.text());
             edit.setHint(AutoReply.DEFAULT_TEXT);
             edit.setTextSize(16);
             edit.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
             edit.setHintTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
             edit.setBackground(null);
             edit.setGravity(Gravity.TOP | Gravity.START);
             edit.setMinLines(3);
             edit.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(12), AndroidUtilities.dp(21), AndroidUtilities.dp(12));
             edit.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
             edit.addTextChangedListener(new TextWatcher() {
                 @Override
                 public void beforeTextChanged(CharSequence s, int start, int count, int after) { }
                 @Override
                 public void onTextChanged(CharSequence s, int start, int before, int count) { }
                 @Override
                 public void afterTextChanged(Editable s) {
                     AutoReply.setText(s.toString());
                 }
             });
             box.addView(edit, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
             list.addView(box, matchWrap());
             addNote(list, context, "Этот текст уходит от твоего имени. Пустой текст — автоответ не отправляется.");
             addHeader(list, context, "Условия");
             addSwitch(list, context, "Отвечать только контактам", AutoReply.KEY_CONTACTS, true);
             addSwitch(list, context, "Отвечать, даже когда я в приложении", AutoReply.KEY_ONLINE, true);
             intervalCell = new TextSettingsCell(context);
             intervalCell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             intervalCell.setOnClickListener(v -> {
                 AlertDialog.Builder b = new AlertDialog.Builder(context);
                 b.setTitle("Не чаще одного раза в");
                 b.setItems(AutoReply.COOLDOWN_TITLES, (dialog, which) -> {
                     AutoReply.setCooldown(which);
                     updateInterval();
                 });
                 showDialog(b.create());
             });
             list.addView(intervalCell, matchWrap());
             updateInterval();
             addNote(list, context, "Один собеседник получает автоответ не чаще выбранного интервала. Старые сообщения при догрузке не отвечаются.");
             return fragmentView;
         }
         private void updateInterval() {
             intervalCell.setTextAndValue("Не чаще одного раза в", AutoReply.COOLDOWN_TITLES[AutoReply.cooldown()], false);
         }
         private LinearLayout.LayoutParams matchWrap() {
             return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
         }
         private void addHeader(LinearLayout list, Context context, String title) {
             HeaderCell header = new HeaderCell(context);
             header.setText(title);
             header.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             list.addView(header, matchWrap());
         }
         private void addSwitch(LinearLayout list, Context context, String title, final String key, boolean divider) {
             final TextCheckCell cell = new TextCheckCell(context);
             cell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
             cell.setTextAndCheck(title, AutoReply.get(key), divider);
             cell.setOnClickListener(v -> {
                 boolean value = !AutoReply.get(key);
                 AutoReply.set(key, value);
                 cell.setChecked(value);
             });
             list.addView(cell, matchWrap());
         }
         private void addNote(LinearLayout list, Context context, String text) {
             TextView note = new TextView(context);
             note.setText(text);
             note.setTextSize(14);
             note.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
             note.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(10), AndroidUtilities.dp(21), AndroidUtilities.dp(16));
             list.addView(note, matchWrap());
         }
     }
