     """
     SRC = {
         "classic": Image.open(io.BytesIO(base64.b64decode(CLASSIC))).convert("RGBA"),
         "ocean": Image.open(io.BytesIO(base64.b64decode(OCEAN))).convert("RGBA"),
     }
     KEYS = {"classic": "VINTAGE", "ocean": "AQUA"}
     FALLBACK = {"classic": "vintage", "ocean": "aqua"}
     def rounded(img, size, circle=False):
         big = Image.new("L", (size[0] * 4, size[1] * 4), 0)
         d = ImageDraw.Draw(big)
         if circle:
             d.ellipse((0, 0, big.width - 1, big.height - 1), fill=255)
         else:
             d.rounded_rectangle((0, 0, big.width - 1, big.height - 1), radius=int(min(size) * 0.27) * 4, fill=255)
         out = img.resize(size, Image.LANCZOS)
         out.putalpha(big.resize(size, Image.LANCZOS))
         return out
     def opaque(img, size):
         bg = Image.new("RGBA", img.size, (0, 0, 0, 255))
         bg.alpha_composite(img)
         return bg.resize(size, Image.LANCZOS)
     ctl = glob.glob("TMessagesProj/src/main/java/**/LauncherIconController.java", recursive=True)
     ctl_src = open(ctl[0], encoding="utf-8").read() if ctl else ""
     if not ctl:
         print("::warning::LauncherIconController.java не найден, ищу ресурсы по имени")
     def res_names(key):
         m = re.search(r'\b' + KEYS[key] + r'\s*\(([^;]*?)\)\s*[,;]', ctl_src, re.S)
         names = re.findall(r'R\.(?:mipmap|drawable)\.(\w+)', m.group(1)) if m else []
         return names
     total = 0
     for key, img in SRC.items():
         names = res_names(key)
         files = []
         if names:
             print(key, "-> ресурсы из LauncherIconController:", names)
             for n in names:
                 for ext in ("png", "webp"):
                     files += glob.glob("TMessagesProj*/src/main/res/**/%s.%s" % (n, ext), recursive=True)
         if not files:
             print("::warning::%s: ресурсы из enum не найдены, ищу по имени *%s*" % (key, FALLBACK[key]))
             for ext in ("png", "webp"):
                 files += glob.glob("TMessagesProj*/src/main/res/**/*%s*.%s" % (FALLBACK[key], ext), recursive=True)
         files = [f for f in files if "/build/" not in f and "anydpi" not in f and "monochrome" not in os.path.basename(f).lower()]
         if not files:
             print("::warning::%s: ни одного файла не заменено" % key)
         for f in sorted(set(files)):
             size = Image.open(f).size
             low = os.path.basename(f).lower()
             if "foreground" in low or "background" in low:
                 out = opaque(img, size)
             else:
                 out = rounded(img, size, circle=("round" in low))
             out.save(f, "WEBP" if f.endswith(".webp") else "PNG")
             total += 1
             print("  заменено:", f, size)
     print("всего файлов заменено:", total)
     os.makedirs("TMessagesProj/src/main/res/drawable-nodpi", exist_ok=True)
     rounded(SRC["ocean"], (96, 96)).save("TMessagesProj/src/main/res/drawable-nodpi/flux_badge.webp", "WEBP")
     print("flux_badge.webp создан")
     PY
  - name: FluxGram - Java-классы (значок, официальный канал, Material You, экран тем)
    env:
     MATERIAL_YOU: ${{ inputs.material_you }}
     BADGE_PARTICLES: ${{ inputs.badge_particles }}
     BADGE_STYLE: ${{ inputs.badge_style }}
    run: |
     set -e
     D=TMessagesProj/src/main/java/org/telegram/messenger
     mkdir -p "$D"
     cat > "$D/FluxBadgeDrawable.java" <<'JAVA'
     package org.telegram.messenger;
     import android.content.Context;
     import android.graphics.Canvas;
     import android.graphics.ColorFilter;
     import android.graphics.Paint;
     import android.graphics.Path;
     import android.graphics.PixelFormat;
     import android.graphics.Rect;
     import android.graphics.drawable.Drawable;
     import android.os.Build;
     import android.os.SystemClock;
     public class FluxBadgeDrawable extends Drawable {
         private static final int N = 9;
         private static final int[] COLORS = {0xFF7FD6FF, 0xFFFFFFFF, 0xFFB388FF, 0xFF8CF0D0};
         private static final int[] COLORS_OFFICIAL = {0xFFFFD54F, 0xFFFFFFFF, 0xFF7FD6FF, 0xFFFFB74D};
         private static volatile int particlesState = -1;
         private final Context appCtx;
         private final Drawable icon;
         private final boolean animated;
         private final boolean official;
         private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
         private final Path star = new Path();
         private final Path check = new Path();
         private final int size;
         private int alpha = 255;
         private int forcedStyle = -1;
         private static volatile int styleState = -1;
         private final int[] md3 = new int[2];
         private final Path shape = new Path();
         private final Path bolt = new Path();
         public static int style(Context ctx) {
             int st = styleState;
             if (st < 0) {
                 st = ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE).getInt("flux_badge_style", FLUX_STYLE_DEFAULT);
                 if (st < 0 || st > 2) {
                     st = 0;
                 }
                 styleState = st;
             }
             return st;
         }
         public static void setStyle(Context ctx, int st) {
             if (st < 0 || st > 2) {
                 st = 0;
             }
             styleState = st;
             ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE).edit().putInt("flux_badge_style", st).apply();
         }
         public FluxBadgeDrawable forceStyle(int st) {
             forcedStyle = st;
             return this;
         }
         private void initMd3Colors(Context ctx, boolean off) {
             int bg = off ? 0xFFFFB68F : 0xFFD0BCFF;
             int fg = off ? 0xFF4A2800 : 0xFF381E72;
             try {
                 if (Build.VERSION.SDK_INT >= 31) {
                     bg = ctx.getResources().getColor(off ? android.R.color.system_accent3_200 : android.R.color.system_accent1_200, null);
                     fg = ctx.getResources().getColor(off ? android.R.color.system_accent3_900 : android.R.color.system_accent1_900, null);
                 }
             } catch (Throwable ignore) {
             }
             md3[0] = bg;
             md3[1] = fg;
         }
         public static boolean particlesEnabled(Context ctx) {
             int st = particlesState;
             if (st < 0) {
                 boolean v = ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE)
                         .getBoolean("flux_particles", FLUX_PARTICLES_DEFAULT);
                 particlesState = v ? 1 : 0;
                 return v;
             }
             return st == 1;
         }
         public static void setParticlesEnabled(Context ctx, boolean on) {
             particlesState = on ? 1 : 0;
             ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE).edit().putBoolean("flux_particles", on).apply();
         }
         public FluxBadgeDrawable(Context ctx, boolean animated, boolean official) {
             Context app = ctx.getApplicationContext();
             this.appCtx = app != null ? app : ctx;
             this.icon = ctx.getResources().getDrawable(R.drawable.flux_badge).mutate();
             this.animated = animated;
             this.official = official;
             this.size = AndroidUtilities.dp(22);
             initMd3Colors(ctx, official);
             setBounds(0, 0, size, size);
         }
         @Override
         public void draw(Canvas canvas) {
             boolean particles = particlesEnabled(appCtx);
             Rect b = getBounds();
             float cx = b.exactCenterX();
             float cy = b.exactCenterY();
             float s = Math.min(b.width(), b.height());
             int half = (int) (s * 0.32f);
             int st = forcedStyle >= 0 ? forcedStyle : style(appCtx);
             if (st == 0) {
                 icon.setBounds((int) cx - half, (int) cy - half, (int) cx + half, (int) cy + half);
                 icon.draw(canvas);
             } else {
                 drawMd3(canvas, cx, cy, half * 1.12f, st);
             }
             if (particles) {
                 drawParticles(canvas, cx, cy, s);
             }
             if (official) {
                 drawCheck(canvas, cx + half * 0.85f, cy + half * 0.85f, s * 0.17f);
             }
             if (animated && particles) {
                 invalidateSelf();
             }
         }
         private void drawMd3(Canvas c, float cx, float cy, float r, int st) {
             shape.reset();
             if (st == 1) {
                 int pts = 96;
                 float amp = 0.085f;
                 for (int i = 0; i <= pts; i++) {
                     double a = 2 * Math.PI * i / pts;
                     float rr = r * (1f - amp + amp * (float) Math.cos(8 * a));
                     float x = cx + rr * (float) Math.cos(a);
                     float y = cy + rr * (float) Math.sin(a);
                     if (i == 0) {
                         shape.moveTo(x, y);
                     } else {
                         shape.lineTo(x, y);
                     }
                 }
                 shape.close();
             } else {
                 float q = r * 0.92f;
                 shape.addRoundRect(cx - q, cy - q, cx + q, cy + q, q * 0.5f, q * 0.5f, Path.Direction.CW);
             }
             paint.setStyle(Paint.Style.FILL);
             paint.setColor(md3[0]);
             paint.setAlpha(alpha);
             c.drawPath(shape, paint);
             float k = r * 0.5f;
             float[] p = {0.18f, -1f, -0.62f, 0.12f, -0.08f, 0.12f, -0.22f, 1f, 0.62f, -0.16f, 0.08f, -0.16f};
             bolt.reset();
             for (int i = 0; i < p.length; i += 2) {
                 float x = cx + p[i] * k;
                 float y = cy + p[i + 1] * k;
                 if (i == 0) {
                     bolt.moveTo(x, y);
                 } else {
                     bolt.lineTo(x, y);
                 }
             }
             bolt.close();
             paint.setColor(md3[1]);
             paint.setAlpha(alpha);
             c.drawPath(bolt, paint);
         }
         private void drawParticles(Canvas canvas, float cx, float cy, float s) {
             int[] colors = official ? COLORS_OFFICIAL : COLORS;
             float t = animated ? (SystemClock.uptimeMillis() % 7000L) / 7000f : 0.2f;
             for (int i = 0; i < N; i++) {
                 float dir = (i % 2 == 0) ? 1f : -1f;
                 float angle = (float) (2 * Math.PI * (i / (float) N + t * dir * (0.7f + 0.15f * (i % 3))));
                 float pulse = (float) Math.sin(2 * Math.PI * (t * 2f + i / (float) N));
                 float r = s * (0.40f + 0.06f * pulse);
                 float px = cx + (float) Math.cos(angle) * r;
                 float py = cy + (float) Math.sin(angle) * r;
                 float tw = 0.35f + 0.65f * Math.abs(pulse);
                 paint.setStyle(Paint.Style.FILL);
                 paint.setColor(colors[i % colors.length]);
                 paint.setAlpha((int) (alpha * tw));
                 float pr = AndroidUtilities.dpf2(0.7f + 0.5f * (i % 3)) * (0.7f + 0.5f * tw);
                 if (i % 3 == 0) {
                     drawStar(canvas, px, py, pr * 2.2f);
                 } else {
                     canvas.drawCircle(px, py, pr, paint);
                 }
             }
         }
         private void drawCheck(Canvas c, float x, float y, float r) {
             paint.setStyle(Paint.Style.FILL);
             paint.setColor(0xFF2AABEE);
             paint.setAlpha(alpha);
             c.drawCircle(x, y, r, paint);
             check.reset();
             check.moveTo(x - r * 0.45f, y);
             check.lineTo(x - r * 0.1f, y + r * 0.38f);
             check.lineTo(x + r * 0.5f, y - r * 0.35f);
             paint.setStyle(Paint.Style.STROKE);
             paint.setStrokeCap(Paint.Cap.ROUND);
             paint.setStrokeJoin(Paint.Join.ROUND);
             paint.setStrokeWidth(Math.max(1f, r * 0.28f));
             paint.setColor(0xFFFFFFFF);
             paint.setAlpha(alpha);
             c.drawPath(check, paint);
             paint.setStyle(Paint.Style.FILL);
         }
         private void drawStar(Canvas c, float x, float y, float r) {
             star.reset();
             star.moveTo(x, y - r);
             star.quadTo(x, y, x + r, y);
             star.quadTo(x, y, x, y + r);
