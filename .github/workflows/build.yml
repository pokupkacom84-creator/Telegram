                 ArrayList<TLRPC.Dialog> dialogs = new ArrayList<>(MessagesController.getInstance(account).getAllDialogs());
                 for (TLRPC.Dialog d : dialogs) {
                     if (d != null && DialogObject.isUserDialog(d.id)) {
                         enqueue(account, d.id, false);
