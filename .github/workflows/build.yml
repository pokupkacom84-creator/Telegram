         static final class Eye extends Drawable {
             private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
             private final Path path = new Path();

             @Override
             public void draw(Canvas c) {
                 Rect b = getBounds();
                 float cx = b.exactCenterX();
                 float cy = b.exactCenterY();
                 float w = Math.max(Math.min(b.width(), b.height()), AndroidUtilities.dp(20)) * 0.9f;
                 boolean on = ghostActive();
                 p.setColor(Theme.getColor(Theme.key_actionBarDefaultIcon));
                 p.setAlpha(on ? 255 : 150);
                 p.setStyle(Paint.Style.STROKE);
                 p.setStrokeWidth(AndroidUtilities.dpf2(1.8f));
                 p.setStrokeCap(Paint.Cap.ROUND);
                 float hw = w * 0.5f;
                 float hh = w * 0.26f;
                 path.reset();
                 path.moveTo(cx - hw, cy);
                 path.quadTo(cx, cy - hh * 2f, cx + hw, cy);
                 path.quadTo(cx, cy + hh * 2f, cx - hw, cy);
                 c.drawPath(path, p);
                 p.setStyle(Paint.Style.FILL);
                 c.drawCircle(cx, cy, w * 0.13f, p);
                 if (on) {
                     p.setStyle(Paint.Style.STROKE);
                     c.drawLine(cx - hw * 0.75f, cy - hw * 0.62f, cx + hw * 0.75f, cy + hw * 0.62f, p);
                 }
             }

             @Override public int getIntrinsicWidth() { return AndroidUtilities.dp(24); }
             @Override public int getIntrinsicHeight() { return AndroidUtilities.dp(24); }
             @Override public void setAlpha(int a) { }
             @Override public void setColorFilter(ColorFilter cf) { }
             @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
         }

