                 case SURFACE: return dark ? (amoled ? 0xFF000000 : hsl(h, n, 0.09f)) : hsl(h, n, 0.98f);
                 case SURFACE_CONTAINER: return dark ? (amoled ? hsl(h, n, 0.05f) : hsl(h, n, 0.13f)) : hsl(h, n, 0.95f);
                 case SURFACE_CONTAINER_HIGH: return dark ? (amoled ? hsl(h, n, 0.10f) : hsl(h, n, 0.18f)) : hsl(h, n, 0.92f);
                 case SURFACE_VARIANT: return dark ? (amoled ? hsl(h, n, 0.08f) : hsl(h, n, 0.17f)) : hsl(h, n, 0.90f);
