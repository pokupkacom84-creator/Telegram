      - name: "FluxGram - 5 функций (view-once, anti-save, premium, speed, profile details)"
        run: |
          python3 - <<'PY'
          import os, re, glob, sys

          report = []
          critical = []
          def ok(m):   print(m); report.append("OK   " + m)
          def warn(m): print("::warning::" + m); report.append("WARN " + m)
          def fail(m): print("::error::" + m); report.append("FAIL " + m); critical.append(m)

          SRC = "TMessagesProj/src/main/java"
          MSG = SRC + "/org/telegram/messenger"
          def find(name):
              r = glob.glob(SRC + "/**/" + name, recursive=True)
              return r[0] if r else None
          def rd(p): return open(p, encoding="utf-8").read()
          def wr(p, s): open(p, "w", encoding="utf-8").write(s)

          def apply(name, pat, repl, label, marker, sig):
              """Один якорь: найден ровно 1 раз - правим, иначе warning и файл не трогаем."""
              p = find(name)
              if not p:
                  warn("%s: файл не найден (%s). Ожидается файл с %s" % (name, label, sig))
                  return False
              s = rd(p)
              if marker in s:
                  ok("%s: уже применено (%s)" % (name, label))
                  return True
              ms = list(re.finditer(pat, s))
              if len(ms) != 1:
                  warn("%s: якорь найден %d раз, нужно 1 - файл не тронут (%s). Ожидается: %s" % (name, len(ms), label, sig))
                  return False
              m = ms[0]
              wr(p, s[:m.start()] + repl(m) + s[m.end():])
              ok("%s: %s" % (name, label))
              return True

          # ---------------------------------------------------------------- Java

          VO_JAVA = r'''package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.telegram.tgnet.TLRPC;

          import java.io.File;
          import java.util.HashSet;
          import java.util.Set;

          /** FluxGram: view-once медиа остаются в кэше после закрытия просмотрщика. */
          public final class FluxViewOnce {

              private static final String PREF = "fluxgram_viewonce";
              private static final String KEY_FILES = "flux_view_once_files";
              private static Set<String> protectedNames;

              private static SharedPreferences prefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              public static boolean keepEnabled() {
                  return FluxStyle.bool(FluxStyle.K_KEEP_VIEW_ONCE, true);
              }

              public static void setKeepEnabled(boolean value) {
                  FluxStyle.setBool(FluxStyle.K_KEEP_VIEW_ONCE, value);
              }

              /** Медиа одного просмотра (не секретный чат: там своё самоуничтожение). */
              public static boolean isViewOnce(MessageObject m) {
                  if (m == null || m.messageOwner == null || m.messageOwner instanceof TLRPC.TL_message_secret) {
                      return false;
                  }
                  TLRPC.MessageMedia media = MessageObject.getMedia(m.messageOwner);
                  return media != null && media.ttl_seconds != 0;
              }

              public static boolean shouldKeep(MessageObject m) {
                  return keepEnabled() && isViewOnce(m);
              }

              private static synchronized Set<String> names() {
                  if (protectedNames == null) {
                      protectedNames = new HashSet<>(prefs().getStringSet(KEY_FILES, new HashSet<String>()));
                  }
                  return protectedNames;
              }

              public static synchronized void protect(File f) {
                  if (f == null) {
                      return;
                  }
                  if (names().add(f.getName())) {
                      prefs().edit().putStringSet(KEY_FILES, new HashSet<>(names())).apply();
                  }
              }

              public static synchronized boolean isProtected(File f) {
                  return f != null && keepEnabled() && names().contains(f.getName());
              }
          }
          '''

          EXTRAS_JAVA = r'''package org.telegram.messenger;

          import org.telegram.tgnet.TLRPC;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          /** FluxGram: ID, DC и примерная дата регистрации в профиле. */
          public final class FluxExtras {

              // ID -> unix time регистрации, по ним линейно интерполируем
              private static final long[][] ANCHORS = {
                  {2768409L, 1383264000L}, {7679610L, 1388448000L}, {11538514L, 1391212000L},
                  {15835244L, 1392940000L}, {23646077L, 1393459000L}, {44634663L, 1399334000L},
                  {46145305L, 1400198000L}, {54845238L, 1411257000L}, {63263518L, 1414454000L},
                  {101260938L, 1425600000L}, {111220210L, 1429574000L}, {116812045L, 1437696000L},
                  {125828524L, 1444003000L}, {157242073L, 1446768000L}, {171295414L, 1457481000L},
                  {222021233L, 1465344000L}, {278941742L, 1473465000L}, {297621225L, 1481846000L},
                  {337808429L, 1487707000L}, {400169472L, 1501459000L}, {805158066L, 1563208000L},
                  {1974255900L, 1634000000L}
              };

              public static String registrationEstimate(long id) {
                  if (id <= 0) {
                      return "неизвестно";
                  }
                  long last = ANCHORS[ANCHORS.length - 1][0];
                  if (id > last) {
                      return "позже 2021";
                  }
                  long ts = ANCHORS[0][1];
                  if (id >= ANCHORS[0][0]) {
                      for (int i = 1; i < ANCHORS.length; i++) {
                          if (id <= ANCHORS[i][0]) {
                              long x0 = ANCHORS[i - 1][0], x1 = ANCHORS[i][0];
                              long y0 = ANCHORS[i - 1][1], y1 = ANCHORS[i][1];
                              ts = y0 + (y1 - y0) * (id - x0) / (x1 - x0);
                              break;
                          }
                      }
                  }
                  return "≈ " + new SimpleDateFormat("LLLL yyyy", Locale.getDefault()).format(new Date(ts * 1000L));
              }

              public static String profileInfo(long userId) {
                  String dc = "?";
                  try {
                      TLRPC.User u = MessagesController.getInstance(UserConfig.selectedAccount).getUser(userId);
                      if (u != null && u.photo != null && u.photo.dc_id != 0) {
                          dc = String.valueOf(u.photo.dc_id);
                      }
                  } catch (Throwable e) {
                      FileLog.e(e);
                  }
                  return "ID " + userId + "  ·  DC " + dc + "  ·  " + registrationEstimate(userId);
              }
          }
          '''

          SECTION_JAVA = r'''
              private void addFeaturesSection(LinearLayout list, Context context) {
                  addHeader(list, context, "Дополнительные функции");
                  addSwitch(list, context, "Сохранять медиа одного просмотра", FluxStyle.K_KEEP_VIEW_ONCE, true, true);
                  addSwitch(list, context, "Сохранение из чатов с запретом копирования", FluxStyle.K_BYPASS_RESTRICT, true, true);
                  addSwitch(list, context, "Локальный Premium (только интерфейс)", FluxStyle.K_LOCAL_PREMIUM, true, true);
                  addSwitch(list, context, "Ускорение загрузки файлов", FluxStyle.K_SPEED_BOOST, true, true);
                  addSwitch(list, context, "ID, DC и дата регистрации в профиле", FluxStyle.K_PROFILE_DETAILS, true, false);
                  addNote(list, context, "Часть изменений применяется после повторного открытия чата или перезапуска приложения. Локальный Premium меняет только вид интерфейса: сервер Premium-функции не включает.");
              }

          '''

          # ---------------------------------------------------------------- 1. ключи в FluxStyle (критично)

          KEYS = [
              ("K_KEEP_VIEW_ONCE", "keep_view_once"),
              ("K_BYPASS_RESTRICT", "bypass_restrict"),
              ("K_LOCAL_PREMIUM", "local_premium"),
              ("K_SPEED_BOOST", "speed_boost"),
              ("K_PROFILE_DETAILS", "profile_details"),
          ]
          sp = find("FluxStyle.java")
          if not sp:
              fail("FluxStyle.java не найден - ключи K_* не вставлены")
          else:
              s = rd(sp)
              anchor = "public static final int GHOST_ITEM_ID = 91370;"
              if s.count(anchor) != 1:
                  fail("FluxStyle.java: якорь GHOST_ITEM_ID найден %d раз, нужно 1" % s.count(anchor))
              else:
                  add = "".join('public static final String %s = "%s";\n    ' % (k, v) for k, v in KEYS if k + " =" not in s)
                  if add:
                      wr(sp, s.replace(anchor, add + anchor, 1))
                      ok("FluxStyle: ключи " + ", ".join(k for k, v in KEYS if k + " =" not in s))
                  else:
                      ok("FluxStyle: ключи уже есть")

          # ---------------------------------------------------------------- 2. FluxViewOnce + FluxExtras (критично)

          vo_path = MSG + "/FluxViewOnce.java"
          try:
              if os.path.exists(vo_path):
                  v = rd(vo_path)
                  if "K_KEEP_VIEW_ONCE" in v:
                      ok("FluxViewOnce.java: уже на K_KEEP_VIEW_ONCE")
                  else:
                      a1 = "return prefs().getBoolean(KEY_KEEP, true);"
                      a2 = "prefs().edit().putBoolean(KEY_KEEP, value).apply();"
                      if v.count(a1) == 1 and v.count(a2) == 1:
                          v = v.replace(a1, "return FluxStyle.bool(FluxStyle.K_KEEP_VIEW_ONCE, true);")
                          v = v.replace(a2, "FluxStyle.setBool(FluxStyle.K_KEEP_VIEW_ONCE, value);")
                          wr(vo_path, v)
                          ok("FluxViewOnce.java: настройка переведена на FluxStyle.K_KEEP_VIEW_ONCE")
                      else:
                          warn("FluxViewOnce.java существует, но keepEnabled()/setKeepEnabled() выглядят иначе - настройка K_KEEP_VIEW_ONCE не подключена. "
                               "Ожидается: %s и %s" % (a1, a2))
              else:
                  wr(vo_path, VO_JAVA)
                  ok("FluxViewOnce.java создан")
          except Exception as e:
              fail("FluxViewOnce.java: " + str(e))

          ex_path = MSG + "/FluxExtras.java"
          try:
              if os.path.exists(ex_path):
                  if "profileInfo" in rd(ex_path):
                      ok("FluxExtras.java: уже есть, profileInfo на месте")
                  else:
                      warn("FluxExtras.java существует без profileInfo(long) - строку профиля нужно добавить вручную")
              else:
                  wr(ex_path, EXTRAS_JAVA)
                  ok("FluxExtras.java создан")
          except Exception as e:
              fail("FluxExtras.java: " + str(e))

          # ---------------------------------------------------------------- 3. view-once: хуки (идемпотентно, якоря те же, что в шаге view-once)

          apply("SecretMediaViewer.java",
                r'(?m)^([ \t]*)ignoreDelete = messageObject\.messageOwner\.ttl == 0x7FFFFFFF;',
                lambda m: (m.group(1) + "ignoreDelete = messageObject.messageOwner.ttl == 0x7FFFFFFF || org.telegram.messenger.FluxViewOnce.shouldKeep(messageObject);\n"
                           + m.group(1) + "if (org.telegram.messenger.FluxViewOnce.shouldKeep(messageObject)) {\n"
                           + m.group(1) + "    org.telegram.messenger.FluxViewOnce.protect(FileLoader.getInstance(currentAccount).getPathToMessage(messageObject.messageOwner));\n"
                           + m.group(1) + "}"),
                "ignoreDelete и защита файла", "FluxViewOnce.shouldKeep(messageObject)",
                "ignoreDelete = messageObject.messageOwner.ttl == 0x7FFFFFFF;")

          apply("SecretMediaViewer.java",
                r'(?m)^([ \t]*)currentMessageObject\.messageOwner\.destroyTime = key;',
                lambda m: (m.group(1) + "if (!org.telegram.messenger.FluxViewOnce.shouldKeep(currentMessageObject)) {\n"
                           + m.group(1) + "    currentMessageObject.messageOwner.destroyTime = key;\n"
                           + m.group(1) + "}"),
                "destroyTime не выставляется для view-once", "FluxViewOnce.shouldKeep(currentMessageObject)",
                "currentMessageObject.messageOwner.destroyTime = key;")

          apply("FileLoader.java",
                r'(?m)^([ \t]*)File file = files\.get\(a\);\n[ \t]*File encrypted = new File\(file\.getAbsolutePath\(\) \+ "\.enc"\);',
                lambda m: (m.group(1) + "File file = files.get(a);\n"
                           + m.group(1) + "if (FluxViewOnce.isProtected(file)) {\n"
                           + m.group(1) + "    continue;\n"
                           + m.group(1) + "}\n"
                           + m.group(1) + 'File encrypted = new File(file.getAbsolutePath() + ".enc");'),
                "deleteFiles пропускает защищённые файлы", "FluxViewOnce.isProtected(file)",
                'File file = files.get(a); File encrypted = new File(file.getAbsolutePath() + ".enc"); в deleteFiles')

          # ---------------------------------------------------------------- 4. сохранение из чатов с запретом копирования

          apply("MessagesController.java",
                r'(?m)^([ \t]*)public boolean isChatNoForwards\(TLRPC\.Chat (\w+)\) \{\n',
                lambda m: (m.group(0)
                           + m.group(1) + "    if (FluxStyle.bool(FluxStyle.K_BYPASS_RESTRICT, true)) {\n"
                           + m.group(1) + "        return false;\n"
                           + m.group(1) + "    }\n"),
                "isChatNoForwards(Chat) возвращает false", "K_BYPASS_RESTRICT",
                "public boolean isChatNoForwards(TLRPC.Chat chat) {")

          # запрет приходит ещё и флагом на самом сообщении: гасим его при разборе TL_message
          apply("TLRPC.java",
                r'(?m)^([ \t]*)noforwards = hasFlag\(flags, FLAG_26\);',
                lambda m: (m.group(1) + "noforwards = hasFlag(flags, FLAG_26) && !org.telegram.messenger.FluxStyle.bool(org.telegram.messenger.FluxStyle.K_BYPASS_RESTRICT, true);"),
                "TL_message.noforwards гасится при разборе", "K_BYPASS_RESTRICT",
                "noforwards = hasFlag(flags, FLAG_26); в TL_message.readParams")

          warn("enableSavingMedia не найден в исходниках: такого поля или метода в этом форке нет, патч не нужен. Ожидалась сигнатура вида boolean enableSavingMedia()")
          warn("isRestrictedMessage / checkCanOpenChat не трогаю: isRestrictedMessage - поле MessageObject про региональные и юридические ограничения контента (restriction_reason), "
               "а не про запрет копирования; метода checkCanOpenChat в форке нет")
          warn("isUserNoForwards (запрет пересылки в личных чатах) не меняю: его включает сам собеседник, это отдельная настройка приватности")

          # ---------------------------------------------------------------- 5. локальный Premium

          apply("UserConfig.java",
                r'(public boolean isPremium\(\) \{\n[ \t]*TLRPC\.User user = currentUser;\n[ \t]*if \(user == null\) \{\n[ \t]*return false;\n[ \t]*\}\n)([ \t]*)return user\.premium;',
                lambda m: (m.group(1)
                           + m.group(2) + "if (FluxStyle.bool(FluxStyle.K_LOCAL_PREMIUM, true)) {\n"
                           + m.group(2) + "    return true;\n"
                           + m.group(2) + "}\n"
                           + m.group(2) + "return user.premium;"),
                "isPremium() true для залогиненного аккаунта", "K_LOCAL_PREMIUM",
                "public boolean isPremium() { TLRPC.User user = currentUser; if (user == null) { return false; } return user.premium; }")

          warn("PremiumPreviewFragment.forcePremium не найден: такого поля нет в форке. Ожидалось: public static boolean forcePremium")
          warn("isPremiumFeatureAvailable: единственный метод с таким именем - private static в ProfileActivity (поиск настроек), он уже даёт true при isPremium()==true")
          warn("StoriesController.isPremium(long uid) не трогаю: он проверяет Premium у другого пользователя, а не у вас")
          warn("premiumLocked не трогаю: MessagesController.premiumFeaturesBlocked() = premiumLocked && !isPremium() уже false при локальном Premium; premiumPurchaseBlocked() оставлен как есть")

          # ---------------------------------------------------------------- 6. ускорение загрузки

          apply("FileLoadOperation.java",
                r'(?m)^([ \t]*)if \(isStory\) \{\n[ \t]*// On slow connections the first part of a visible story arrives sooner when parts are small\.',
                lambda m: (m.group(1) + "if (FluxStyle.bool(FluxStyle.K_SPEED_BOOST, true) && !forceSmallChunk) {\n"
                           + m.group(1) + "    downloadChunkSizeBig = 1024 * 1024;\n"
                           + m.group(1) + "    maxDownloadRequests = 12;\n"
                           + m.group(1) + "    maxDownloadRequestsBig = 12;\n"
                           + m.group(1) + "}\n"
                           + m.group(0)),
                "updateParams: чанк 1 МБ, 12 параллельных запросов", "K_SPEED_BOOST",
                "private void updateParams() { ... if (isStory) { // On slow connections ... }")

          warn("FileUploadOperation: лимита 0x800 в startUploadRequest() нет. Параллелизм здесь задаёт maxUploadingKBytes = 1024 * 8 "
               "(maxRequestsCount = maxUploadingKBytes / uploadChunkSize, у больших файлов это уже ~16 запросов), менять вслепую не стал")

          # ---------------------------------------------------------------- 7. детали профиля: подключаем настройку к уже вставленной строке

          apply("ProfileActivity.java",
                r'(?m)^([ \t]*)fluxInfoRow = userId != 0 \? rowCount\+\+ : -1;',
                lambda m: (m.group(1) + "fluxInfoRow = userId != 0 && org.telegram.messenger.FluxStyle.bool(org.telegram.messenger.FluxStyle.K_PROFILE_DETAILS, true) ? rowCount++ : -1;"),
                "строка профиля зависит от K_PROFILE_DETAILS", "K_PROFILE_DETAILS",
                "fluxInfoRow = userId != 0 ? rowCount++ : -1; (его вставляет шаг «детали профиля»)")

          # ---------------------------------------------------------------- 8. переключатели в «Визуал и стиль»

          ap = find("FluxStyleActivity.java")
          if not ap:
              warn("FluxStyleActivity.java не найден - переключатели функций не добавлены (настройки останутся по умолчанию)")
          else:
              a = rd(ap)
              if "addFeaturesSection" in a:
                  ok("FluxStyleActivity: секция функций уже добавлена")
              else:
                  mm = re.search(r'(?m)^([ \t]*)private LinearLayout\.LayoutParams matchWrap\(\)\s*\{', a)
                  cm = re.search(r'(?m)^([ \t]*)updateCells\(\);\n[ \t]*FluxStyle\.springIn\(root\);', a)
                  if not mm or not cm:
                      warn("FluxStyleActivity: не найдены точки вставки (matchWrap=%s, updateCells+springIn=%s) - переключатели не добавлены" % (bool(mm), bool(cm)))
                  else:
                      call = cm.group(1) + "addFeaturesSection(list, context);\n"
                      a = a[:mm.start()] + SECTION_JAVA.lstrip("\n") + a[mm.start():]
                      cm = re.search(r'(?m)^([ \t]*)updateCells\(\);\n[ \t]*FluxStyle\.springIn\(root\);', a)
                      a = a[:cm.start()] + call + a[cm.start():]
                      wr(ap, a)
                      ok("FluxStyleActivity: секция «Дополнительные функции» (5 переключателей)")

          # ---------------------------------------------------------------- отчёт

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
              f.write("## FluxGram: 5 функций\n```\n" + "\n".join(report) + "\n```\n")
          if critical:
              print("::error::Критичные патчи не применились: " + "; ".join(critical))
              sys.exit(1)
          PY

